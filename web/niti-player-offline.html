const DICE_SIDES=Object.freeze([4,6,8,10,12,20,100]);
function diceRandomFace(sides){if(!DICE_SIDES.includes(sides))throw new RangeError('Неизвестный кубик.');if(!globalThis.crypto||typeof globalThis.crypto.getRandomValues!=='function')throw new Error('Генератор случайных чисел недоступен в этом браузере.');const limit=Math.floor(4294967296/sides)*sides,buffer=new Uint32Array(1);do{globalThis.crypto.getRandomValues(buffer);}while(buffer[0]>=limit);return buffer[0]%sides+1;}
function diceValidRecord(r){return !!r&&typeof r.id==='string'&&r.id.length>0&&r.id.length<120&&DICE_SIDES.includes(r.sides)&&Number.isInteger(r.count)&&r.count>=1&&r.count<=20&&Number.isInteger(r.modifier)&&r.modifier>=-100&&r.modifier<=100&&Array.isArray(r.rolls)&&r.rolls.length===r.count&&r.rolls.every(n=>Number.isInteger(n)&&n>=1&&n<=r.sides)&&Number.isInteger(r.sum)&&r.sum===r.rolls.reduce((a,b)=>a+b,0)&&Number.isInteger(r.total)&&r.total===r.sum+r.modifier&&typeof r.date==='string'&&r.date.length<60&&Number.isFinite(Date.parse(r.date));}
const diceSession=(()=>{let history=[];try{const raw=localStorage.getItem('niti-dice-v1');if(raw&&raw.length<65536){const parsed=JSON.parse(raw);if(Array.isArray(parsed))history=parsed.filter(diceValidRecord).slice(0,20);}}catch{}return{history,last:history[0]||null,selected:history[0]?.sides||20,count:'1',modifier:'0',open:false,error:'',message:'',storageOK:true,serial:0};})();
function diceHasNaturalOne(record){return Array.isArray(record?.rolls)&&record.rolls.includes(1);}
function diceCardHasNaturalOne(sides){return diceSession.last?.sides===sides&&diceHasNaturalOne(diceSession.last);}
function diceFormula(sides,count,modifier){return `${count}d${sides}${modifier>0?' + '+modifier:modifier<0?' − '+Math.abs(modifier):''}`;}
function diceShape(sides){
  // Absolute coordinates keep every face edge anchored to its actual vertex.
  // Closing each silhouette separately avoids the relative moves after Z that

  const shapes={
    4:'<path d="M32 5 L59 55 L5 55 Z M32 5 L32 37 M5 55 L32 37 L59 55"/>',
    6:'<path d="M32 4 L57 18 L57 46 L32 60 L7 46 L7 18 Z M7 18 L32 33 L57 18 M32 33 L32 60"/>',

    12:'<path d="M32 3 L48 9 L60 25 L58 42 L49 56 L32 61 L15 56 L6 42 L4 25 L16 9 Z M32 15 L47 26 L41 44 L23 44 L17 26 Z M32 3 L32 15 M60 25 L47 26 M49 56 L41 44 M15 56 L23 44 M4 25 L17 26"/>',
    20:'<path d="M32 3 L54 16 L59 41 L32 61 L5 41 L10 16 Z M32 17 L45 41 L19 41 Z M32 3 L32 17 M10 16 L32 17 L54 16 M10 16 L19 41 L5 41 M54 16 L45 41 L59 41 M19 41 L32 61 L45 41"/>',
    100:'<path d="M22 4 L42 19 L36 40 L22 52 L8 40 L2 19 Z M22 4 L22 30 L22 52 M2 19 L22 30 L42 19 M8 40 L22 30 L36 40"/><path class="dice-front-face" d="M42 12 L62 27 L56 48 L42 60 L28 48 L22 27 Z"/><path d="M42 12 L42 36 L42 60 M22 27 L42 36 L62 27 M28 48 L42 36 L56 48"/>'
  };

}
function diceResultHTML(){const r=diceSession.last;if(!r)return `<div class="dice-result-empty"><span class="dice-empty-mark">?</span><h2>Шанс ждёт твоего хода.</h2><p>Выбери кубик. Результат появится здесь.</p></div>`;return `<div class="dice-result-heading"><span class="eyebrow">ПОСЛЕДНИЙ БРОСОК</span><span class="tag">${diceFormula(r.sides,r.count,r.modifier)}</span></div><div class="dice-total">${r.total}</div><div class="dice-calculation">${r.count>1?`${r.rolls.join(' + ')} = ${r.sum}`:'Выпало '+r.sum}${r.modifier?`<span>Модификатор: ${r.modifier>0?'+':''}${r.modifier}</span>`:''}</div><div class="dice-faces" aria-label="Отдельные результаты">${r.rolls.map((n,i)=>`<span class="dice-face ${n===1?'dice-face-one':n===r.sides?'dice-face-max':''}" title="Кубик ${i+1}: ${n}${n===1?' · выпала 1':''}">${n}</span>`).join('')}</div><button type="button" class="button primary dice-repeat" data-dice-action="repeat">Повторить ${diceFormula(r.sides,r.count,r.modifier)}</button>`;}
function diceHistoryHTML(){return diceSession.history.length?`<ol class="dice-history-list" tabindex="0" aria-label="История последних бросков">${diceSession.history.map(r=>`<li class="dice-history-row"><span class="dice-history-formula">${diceFormula(r.sides,r.count,r.modifier)}<small>${r.rolls.join(', ')}${r.modifier?' · мод. '+(r.modifier>0?'+':'')+r.modifier:''}</small></span><strong>${r.total}</strong><time datetime="${esc(r.date)}">${esc(new Date(r.date).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}))}</time></li>`).join('')}</ol>`:`<div class="dice-history-empty">Здесь будут последние 20 бросков.</div>`;}
function diceCardConfig(){const count=Number(diceSession.count),modifier=Number(diceSession.modifier);return diceSession.count.trim()&&diceSession.modifier.trim()&&Number.isInteger(count)&&count>=1&&count<=20&&Number.isInteger(modifier)&&modifier>=-100&&modifier<=100?{count,modifier}:{count:1,modifier:0};}
function diceUpdateCardLabels(){const config=diceCardConfig();document.querySelectorAll('[data-dice-sides]').forEach(button=>{const sides=Number(button.dataset.diceSides),formula=diceFormula(sides,config.count,config.modifier);button.setAttribute('aria-label','Бросить '+formula);button.querySelector('strong').textContent=formula;button.querySelector('span').textContent='от '+(config.count+config.modifier)+' до '+(config.count*sides+config.modifier);});const summary=document.querySelector('.dice-options>summary>span');if(summary)summary.textContent=config.count===1&&config.modifier===0?'необязательно':config.count+' куб. · мод. '+(config.modifier>0?'+':'')+config.modifier;}
function dicePage(){const cfg=diceCardConfig();return head('МОДУЛЬ СЛУЧАЙНЫХ СОБЫТИЙ','Кубики. Твой следующий ход.','Семь кубиков на одном экране. Выбери нужный и бросай, когда этого требует история.')+`<div class="dice-workspace"><section class="panel dice-console"><div class="panel-header"><h2 class="panel-title">Выбери кубик</h2><span class="tag">d4 — d100</span></div><div class="dice-picker">${DICE_SIDES.map(s=>`<button type="button" class="dice-card ${diceSession.selected===s?'selected':''}${diceCardHasNaturalOne(s)?' dice-natural-one':''}" data-dice-action="roll" data-dice-sides="${s}" aria-pressed="${diceSession.selected===s}" aria-label="Бросить ${diceFormula(s,cfg.count,cfg.modifier)}">${diceShape(s)}<strong>${diceFormula(s,cfg.count,cfg.modifier)}</strong><span>от ${cfg.count+cfg.modifier} до ${cfg.count*s+cfg.modifier}</span></button>`).join('')}</div><details class="dice-options" ${diceSession.open?'open':''}><summary>Несколько кубиков и модификатор <span>${cfg.count===1&&cfg.modifier===0?'необязательно':cfg.count+' куб. · мод. '+(cfg.modifier>0?'+':'')+cfg.modifier}</span></summary><form id="diceOptionsForm" novalidate><div class="dice-option-fields"><label><span class="field-label">КОЛИЧЕСТВО · 1–20</span><input class="input" type="number" id="diceCount" name="count" min="1" max="20" step="1" value="${esc(diceSession.count)}" inputmode="numeric" aria-describedby="diceOptionHint"></label><label><span class="field-label">МОДИФИКАТОР · −100…100</span><input class="input" type="number" id="diceModifier" name="modifier" min="-100" max="100" step="1" value="${esc(diceSession.modifier)}" inputmode="numeric" aria-describedby="diceOptionHint"></label></div><p id="diceOptionHint">Количество и модификатор применяются к следующему выбранному кубику. Например: 2d6 + 3.</p><button class="button ghost small" type="submit">Бросить выбранный d${diceSession.selected}</button></form></details><div class="dice-console-note">Броски хранятся здесь отдельно от сюжетного журнала.</div></section><section class="panel dice-result-panel"><div class="panel-header"><h2 class="panel-title">Результат</h2><span class="dice-signal">● ГОТОВ К БРОСКУ</span></div><div class="dice-result-content" id="diceResult">${diceResultHTML()}</div><div class="dice-live" id="diceLive" role="status" aria-live="polite" aria-atomic="true">${esc(diceSession.error||diceSession.message)}</div></section><section class="panel dice-history-panel"><div class="panel-header"><h2 class="panel-title">История бросков <span class="badge" id="diceHistoryCount">${diceSession.history.length}</span></h2><button type="button" class="text-button" data-dice-action="clear" ${diceSession.history.length?'':'disabled'}>Очистить</button></div><div id="diceHistory">${diceHistoryHTML()}</div><div class="dice-history-note" id="diceHistoryNote">${diceSession.storageOK?'Последние 20 результатов сохраняются в этом браузере.':'История доступна до закрытия вкладки: браузер не разрешил сохранение.'}</div></section></div>`;}
function diceSaveHistory(){try{localStorage.setItem('niti-dice-v1',JSON.stringify(diceSession.history));diceSession.storageOK=true;}catch{diceSession.storageOK=false;}}
function diceReadOptions(){const c=document.getElementById('diceCount'),m=document.getElementById('diceModifier');if(c)diceSession.count=c.value;if(m)diceSession.modifier=m.value;const count=Number(diceSession.count),modifier=Number(diceSession.modifier);c?.removeAttribute('aria-invalid');m?.removeAttribute('aria-invalid');if(!diceSession.count.trim()||!Number.isInteger(count)||count<1||count>20){c?.setAttribute('aria-invalid','true');c?.focus();throw new Error('Укажи целое количество от 1 до 20.');}if(!diceSession.modifier.trim()||!Number.isInteger(modifier)||modifier<-100||modifier>100){m?.setAttribute('aria-invalid','true');m?.focus();throw new Error('Модификатор должен быть целым числом от −100 до 100.');}return{count,modifier};}
function diceRefresh(){const result=document.getElementById('diceResult'),history=document.getElementById('diceHistory'),live=document.getElementById('diceLive');if(result)result.innerHTML=diceResultHTML();if(history)history.innerHTML=diceHistoryHTML();if(live){live.textContent=diceSession.error||diceSession.message;live.classList.toggle('dice-error',!!diceSession.error);}const counter=document.getElementById('diceHistoryCount');if(counter)counter.textContent=diceSession.history.length;const clear=document.querySelector('[data-dice-action="clear"]');if(clear)clear.disabled=!diceSession.history.length;const note=document.getElementById('diceHistoryNote');if(note)note.textContent=diceSession.storageOK?'Последние 20 результатов сохраняются в этом браузере.':'История доступна до закрытия вкладки: браузер не разрешил сохранение.';document.querySelectorAll('[data-dice-sides]').forEach(b=>{const chosen=Number(b.dataset.diceSides)===diceSession.selected;b.classList.toggle('selected',chosen);b.classList.toggle('dice-natural-one',diceCardHasNaturalOne(Number(b.dataset.diceSides)));b.setAttribute('aria-pressed',String(chosen));});const form=document.getElementById('diceOptionsForm');if(form)form.querySelector('button').textContent='Бросить выбранный d'+diceSession.selected;}
function diceRoll(sides,repeat=false){if(!DICE_SIDES.includes(sides))return;try{let config;if(repeat&&diceSession.last){config={count:diceSession.last.count,modifier:diceSession.last.modifier};}else config=diceReadOptions();const rolls=Array.from({length:config.count},()=>diceRandomFace(sides));const sum=rolls.reduce((a,b)=>a+b,0);const record={id:Date.now().toString(36)+'-'+(++diceSession.serial),date:new Date().toISOString(),sides,count:config.count,modifier:config.modifier,rolls,sum,total:sum+config.modifier};diceSession.selected=sides;diceSession.last=record;diceSession.history.unshift(record);diceSession.history=diceSession.history.slice(0,20);diceSession.error='';diceSession.message='Бросок '+diceSession.serial+'. '+diceFormula(sides,config.count,config.modifier)+': результат '+record.total+'.'+(config.count>1?' Кубики: '+rolls.join(', ')+'.':'')+(diceHasNaturalOne(record)?' Выпала 1 на кубике.':'');diceSaveHistory();diceRefresh();if(repeat)document.querySelector('.dice-repeat')?.focus();}catch(error){diceSession.error=error instanceof Error?error.message:'Не удалось выполнить бросок. Попробуй ещё раз.';diceRefresh();}}
document.addEventListener('click',event=>{const button=event.target.closest('[data-dice-action]');if(!button)return;const action=button.dataset.diceAction;if(action==='roll')diceRoll(Number(button.dataset.diceSides));else if(action==='repeat'&&diceSession.last)diceRoll(diceSession.last.sides,true);else if(action==='clear'){diceSession.history=[];diceSession.message='История бросков очищена.';diceSession.error='';diceSaveHistory();diceRefresh();}});
document.addEventListener('submit',event=>{if(event.target.id!=='diceOptionsForm')return;event.preventDefault();diceRoll(diceSession.selected);});
document.addEventListener('input',event=>{if(event.target.id==='diceCount')diceSession.count=event.target.value;if(event.target.id==='diceModifier')diceSession.modifier=event.target.value;if(event.target.id==='diceCount'||event.target.id==='diceModifier')diceUpdateCardLabels();});
document.addEventListener('toggle',event=>{if(event.target.matches?.('.dice-options'))diceSession.open=event.target.open;},true);
</script><script>'use strict';
/* Only announced missions and the participant's own rewards reach this view. */
(function () {
  const ACCESS_KEY = 'niti-player-session-v1';
  const ACCESS_ARCHIVE_PREFIX = 'niti-player-session-access-';
  const DELETED_KEY = 'niti-player-character-deleted-v1';
  const ID_PATTERN = /^[A-Za-z0-9_-]{16,100}$/;
  const TOKEN_PATTERN = /^[A-Za-z0-9_-]{32,150}$/;
  const ONLINE = document.documentElement.dataset.offline !== 'true'
    && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
  let access = readAccess(), snapshot = null, connection = 'idle', connectionMessage = '', lastSuccess = 0;
  let pollingTimer = 0, requestInFlight = null, joining = false, leavePrompt = false;
  let characterSyncTimer = 0, characterSyncInFlight = false, characterSyncWanted = null, characterSyncLast = '';
  let personaSyncTimer=0,personaSyncInFlight=false,personaSyncWanted=null,personaSyncLast='',personaSyncError='';
  let requestedRoom = roomFromValue(new URLSearchParams(location.search).get('room') || '');
  let choosingResult = null, choiceError = '', choiceErrorMission = '';

  function safeText(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function readAccess() {
    try {
      const saved = JSON.parse(localStorage.getItem(ACCESS_KEY));

    } catch { return null; }
  }
  function validAccess(value) {
    return !!value && ID_PATTERN.test(value.roomId) && TOKEN_PATTERN.test(value.playerToken)
      && (!value.playerId || ID_PATTERN.test(value.playerId))
      && (!value.joinKey || ID_PATTERN.test(value.joinKey))
      && typeof value.name === 'string' && value.name.length <= 80;
  }
  function writeAccess(value) {
    try {
      if (value) {
        localStorage.setItem(ACCESS_KEY, JSON.stringify(value));
        localStorage.setItem(ACCESS_ARCHIVE_PREFIX + value.roomId, JSON.stringify(value));
      } else localStorage.removeItem(ACCESS_KEY);
      return true;
    } catch { return false; }
  }
  function randomKey(bytes) {
    const data = new Uint8Array(bytes);
    crypto.getRandomValues(data);
    return Array.from(data, n => n.toString(16).padStart(2, '0')).join('');
  }
  function roomFromValue(value) {
    const raw = String(value || '').trim();
    if (ID_PATTERN.test(raw)) return raw;

      const id = link.searchParams.get('room') || '';
      return ID_PATTERN.test(id) ? id : '';

  }
  function notify(message) {
    if (typeof toast === 'function') toast(message);

  function currentRoomId() { return requestedRoom || access?.roomId || ''; }
  function hasCurrentAccess() { return access && access.roomId === currentRoomId(); }
  function statusText() {
    if (!ONLINE) return 'Офлайн-терминал';
    if (joining) return 'Подключаем персонажа…';
    if (!hasCurrentAccess()) return 'Ожидает подключения';
    if (connection === 'loading' && !snapshot) return 'Соединяемся с сессией…';
    if (connection === 'live') return 'На связи';
    if (connection === 'denied') return 'Нужен доступ к персонажу';
    if (connection === 'missing') return 'Сессия недоступна';
    if (connection === 'offline') return 'Связь прервана';

  }
  function statusMarkup() {
    const label = statusText();
    return `<span class="session-connection ${connection === 'live' ? 'is-live' : ''}" data-session-status role="status"><span aria-hidden="true"></span>${safeText(label)}</span>`;
  }
  function shortTime(value) {
    const time = new Date(value);
    return Number.isFinite(time.getTime()) ? time.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  }
  function errorMarkup() {
    if (!connectionMessage) return '';
    return `<div class="session-notice" role="status">${safeText(connectionMessage)}${lastSuccess && connection !== 'live' ? `<small>Последнее обновление: ${safeText(shortTime(lastSuccess))}. Показаны последние полученные данные.</small>` : ''}</div>`;
  }
  function itemList(items, emptyText, className) {
    return `<div class="session-item-list" ${className}>${Array.isArray(items) && items.length ? items.map(item => `<div class="session-item"><span aria-hidden="true">◇</span><strong>${safeText(item.name)}</strong><b>×${safeText(item.quantity)}</b></div>`).join('') : `<p class="session-empty-copy">${emptyText}</p>`}</div>`;
  }
  function resolutionMarkup(room) {
    const mission = room.mission;
    if (!mission?.choiceVersion || !Array.isArray(mission.choices) || !mission.choices.length) return '';
    const pending = choosingResult?.roomId === room.id && choosingResult.missionId === mission.id;
    const complete = !!room.completedMissions?.[mission.id];
    return `<section class="session-resolutions" aria-labelledby="session-resolution-title" aria-busy="${!!pending}"><div class="session-resolution-heading"><div><span class="eyebrow">РЕШЕНИЕ ОТРЯДА</span><h3 id="session-resolution-title">Что произошло?</h3></div><span class="session-resolution-stamp" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v7a4 4 0 0 0 4 4h10m-5-5 5 5-5 5"/></svg></span></div><p class="session-resolution-help">Подтвердите только то, что уже произошло в игре. Выбор общий для отряда: награда и записи мастера обновятся автоматически. Неудачу отмечает мастер.</p><div class="session-resolution-list">${mission.choices.map((choice, index) => {
      const selected = choice.selected === true || (room.events || []).some(event => event.missionId === mission.id && event.resultId === choice.id);
      const available = typeof choice.available === 'boolean' ? choice.available : !complete;
      const busy = pending && choosingResult.resultId === choice.id;
      return `<button type="button" class="session-resolution-button ${selected ? 'is-selected' : ''}" data-session-action="choose-result" data-mission-id="${safeText(mission.id)}" data-result-id="${safeText(choice.id)}" data-choice-version="${safeText(mission.choiceVersion)}" aria-pressed="${selected}" ${selected || !available || pending || connection !== 'live' ? 'disabled' : ''}><span class="session-resolution-number" aria-hidden="true">${String(index + 1).padStart(2,'0')}</span><span class="session-resolution-copy"><strong>${safeText(choice.label)}</strong><small>${selected ? 'Подтверждено для отряда' : busy ? 'Сохраняем результат…' : !available ? 'Другой исход уже выбран' : 'Подтвердить результат'}</small></span><span class="session-resolution-check" aria-hidden="true">${selected ? '✓' : busy ? '…' : '↗'}</span></button>`;
    }).join('')}</div><p class="session-resolution-status" data-session-choice-status role="status">${safeText(pending ? 'Результат сохраняется. Повторное нажатие не нужно.' : (choiceErrorMission === mission.id ? choiceError : '') || '')}</p></section>`;
  }
  function missionMarkup(room) {
    const mission = room.mission;
    if (!mission) return `<section class="panel session-mission session-mission-waiting" data-session-mission><div class="session-signal-art" aria-hidden="true"><span>⌁</span><i></i><i></i><i></i></div><div class="eyebrow">КАНАЛ ВЕДУЩЕГО ОТКРЫТ</div><h2>Ждём следующую миссию.</h2><p>Как только ведущий выберет задание, оно появится здесь. Страницу обновлять не нужно.</p></section>`;
    const complete = !!room.completedMissions?.[mission.id];
    const result = room.result?.missionId === mission.id ? room.result : null;
    return `<section class="panel session-mission ${complete ? 'is-complete' : ''}" data-session-mission><div class="session-section-label"><span class="eyebrow">${complete ? 'МИССИЯ ЗАВЕРШЕНА' : 'ПРЯМО СЕЙЧАС'}</span><span class="tag">${complete ? 'ВЫПОЛНЕНО ✓' : 'ЗАДАНИЕ ВЕДУЩЕГО'}</span></div><h2>${safeText(mission.title)}</h2><p class="session-description">${safeText(mission.description)}</p>${Array.isArray(mission.actions) && mission.actions.length ? `<div class="session-action-heading">ЧТО МОЖНО СДЕЛАТЬ</div><ol class="session-choices">${mission.actions.map((action, index) => `<li><span class="session-choice-number">${String(index + 1).padStart(2, '0')}</span><span>${safeText(action.label)}</span></li>`).join('')}</ol><p class="session-choice-hint">Обсудите действие с группой. Когда оно совершено, подтвердите доступный результат ниже.</p>` : ''}${resolutionMarkup(room)}${result ? `<div class="session-announced-result"><span class="eyebrow">${result.complete ? 'ИТОГ МИССИИ' : 'СОБЫТИЕ'}</span><p>${safeText(result.summary)}</p></div>` : ''}</section>`;
  }
  function eventsMarkup(events) {
    const list = Array.isArray(events) ? events.slice().reverse() : [];
    return `<section class="panel session-history"><div class="panel-header"><h2 class="panel-title">Сигналы сессии</h2><span class="badge">${list.length}</span></div><div class="session-events" data-session-events>${list.length ? list.map(event => `<article class="session-event"><div class="session-event-top"><span>${event.complete ? 'МИССИЯ ЗАВЕРШЕНА' : 'СОБЫТИЕ'}</span><time>${safeText(shortTime(event.createdAt))}</time></div><p>${safeText(event.summary)}</p>${event.xp || event.items?.length ? `<div class="session-event-reward">${event.xp ? `<span>+${safeText(event.xp)} XP участникам события</span>` : ''}${event.items?.length ? `<span>${event.items.map(item => safeText(item.name) + ' ×' + safeText(item.quantity)).join(' · ')}</span>` : ''}</div>` : ''}</article>`).join('') : '<p class="session-empty-copy">Итоги и награды появятся здесь после подтверждения результата.</p>'}</div></section>`;
  }
  function roomMarkup(room) {

    return `<div class="session-room-bar"><div><span class="eyebrow">ОБЩАЯ ИГРОВАЯ КОМНАТА</span><h2>${safeText(room.name)}</h2><span class="session-player-label">Игрок: ${safeText(self.ownerName || 'Не указано')} · Персонаж: ${safeText(self.name)}</span></div><div class="session-room-controls">${statusMarkup()}<button type="button" class="button ghost small" data-session-action="refresh">Обновить</button></div></div>${errorMarkup()}<div class="session-grid"><div class="session-main-column">${missionMarkup(room)}${eventsMarkup(room.events)}</div><aside class="session-side-column"><section class="panel session-experience"><span class="eyebrow">ТВОЙ ОПЫТ В СЕССИИ</span><div class="session-xp-number"><strong data-session-xp>${safeText(self.xp || 0)}</strong><span>XP</span></div><p>За подтверждённые результаты опыт начисляется автоматически. Мастер также может выдать награду. Опыт учитывается в анкете.</p><small>Награды сохраняются и приходят, даже если ты временно не в сети. Учитываются события после твоего вступления.</small></section><section class="panel session-inventory"><div class="panel-header"><h2 class="panel-title">Полученное снаряжение</h2></div>${itemList(self.inventory, 'Личные награды ещё не выданы.', 'data-session-personal-items')}<p class="session-card-hint"><a class="text-button" href="#inventory">Открыть инвентарь и экипировку ↗</a></p></section><section class="panel session-inventory"><div class="panel-header"><h2 class="panel-title">Общий тайник</h2><span class="tag">НА ГРУППУ</span></div>${itemList(room.sharedItems, 'Общая добыча пока не найдена.', 'data-session-shared-items')}<p class="session-card-hint"><a class="text-button" href="#inventory">Забрать вещи из тайника ↗</a></p></section><section class="panel session-party"><div class="panel-header"><h2 class="panel-title">Участники</h2><span class="badge">${room.players?.length || 0}</span></div><ul>${(room.players || []).map(member => `<li><span class="session-member-initial" aria-hidden="true">${safeText((member.name || '?').slice(0, 1))}</span><strong>${safeText(member.name)}</strong>${member.id === self.id ? '<small>ТЫ</small>' : ''}</li>`).join('')}</ul><p class="session-card-hint">Список вошедших в сессию; он не показывает присутствие в сети.</p></section></aside></div><div class="session-access-bar"><p>Доступ к этому персонажу сохранён в браузере. Скачай его для переноса на другое устройство.</p><div><button type="button" class="button ghost small" data-session-action="export">↓ Сохранить доступ</button><button type="button" class="button ghost small" data-session-action="leave">Отключиться</button></div></div>${leavePrompt ? `<div class="session-disconnect-confirm" role="alert"><p>Отключить этот браузер от сессии? Персонаж и награды останутся в комнате. Для возвращения сохрани доступ.</p><div><button type="button" class="button ghost small" data-session-action="export">Сохранить доступ</button><button type="button" class="button ghost small" data-session-action="leave-cancel">Остаться</button><button type="button" class="button danger small" data-session-action="leave-confirm">Отключиться</button></div></div>` : ''}`;

  function joinMarkup() {
    if (!ONLINE) return `<section class="panel session-offline"><div class="eyebrow">ЛИЧНЫЕ ИНСТРУМЕНТЫ ДОСТУПНЫ</div><h2>Сессия работает в интернете.</h2><p>Открой онлайн-терминал по приглашению ведущего, чтобы получать миссии и награды. Персонаж, заметки и кубики в этом файле работают без соединения.</p></section>`;
    const roomId = currentRoomId();
    const profileName = typeof player !== 'undefined' ? player.profile?.name || '' : '';
    const defaultName = access?.roomId === roomId ? access.name : '';
    const existingDifferent = access && requestedRoom && access.roomId !== requestedRoom;
    return `<div class="session-join-grid"><section class="panel session-join-card"><div class="eyebrow">ПРИСОЕДИНИТЬСЯ К ИСТОРИИ</div><h2>Сигнал от ведущего.</h2><p>Вставь ссылку-приглашение и укажи имя игрока. Миссии и награды будут появляться в этом терминале.</p>${existingDifferent ? '<div class="session-notice">Открыто приглашение в другую комнату. Личные заметки и лист персонажа сохранятся. Доступ к прежней комнате останется в этом браузере.</div>' : ''}<form id="playerSessionJoinForm"><div class="field"><label class="field-label" for="player-session-room">ССЫЛКА ИЛИ КОД КОМНАТЫ</label><input class="input" id="player-session-room" name="room" value="${safeText(roomId)}" autocomplete="off" spellcheck="false" required maxlength="500" placeholder="Вставь приглашение ведущего"></div><div class="field"><label class="field-label" for="player-session-name">ИМЯ ИГРОКА</label><input class="input" id="player-session-name" name="name" value="${safeText(defaultName || '')}" autocomplete="nickname" required maxlength="80" placeholder="Твоё имя или ник"></div><div class="session-join-actions"><button type="submit" class="button primary" data-session-action="join-submit" ${joining ? 'disabled' : ''}>${joining ? 'Подключаем…' : 'Войти в сессию ↗'}</button><span class="session-form-feedback" data-session-form-feedback role="status">${safeText(connectionMessage)}</span></div></form><div class="session-restore-control"><button type="button" class="text-button" data-session-action="import">↥ Восстановить доступ к персонажу</button>${existingDifferent ? '<button type="button" class="text-button" data-session-action="return-current">Вернуться в прежнюю комнату</button>' : ''}</div></section><section class="panel session-join-info"><div class="session-signal-art" aria-hidden="true"><span>⌁</span><i></i><i></i><i></i></div><h2>Одна группа.<br>Общая история.</h2><ul><li><strong>Миссия и варианты действий</strong><span>Всё, что ведущий открыл для вашей группы.</span></li><li><strong>Опыт и добыча</strong><span>Появляются после подтверждённого результата.</span></li><li><strong>Твои записи остаются твоими</strong><span>Личная анкета и заметки остаются в браузере. Отряд видит только арт, имя, возраст, пол персонажа и имя игрока.</span></li></ul></section></div>`;
  }
  function contentMarkup() {
    if (!ONLINE) return joinMarkup();
    if (hasCurrentAccess() && snapshot) return roomMarkup(snapshot);
    if (hasCurrentAccess() && !['denied', 'missing'].includes(connection)) return `<section class="panel session-connecting">${statusMarkup()}<h2>${connection === 'offline' ? 'Не удалось получить данные.' : 'Настраиваем приём…'}</h2><p>Твой персонаж и награды хранятся в игровой комнате.</p>${errorMarkup()}<div class="session-join-actions"><button type="button" class="button primary" data-session-action="refresh">Попробовать снова</button><button type="button" class="button ghost" data-session-action="rejoin">Ввести приглашение</button></div></section>`;
    return joinMarkup();
  }
  function page() {
    const heading = typeof head === 'function' ? head('ПРИЁМ ОТКРЫТ', 'Игровая сессия.', 'Миссии, решения и награды от ведущего в одном канале.') : '<h1>Игровая сессия</h1>';
    if (hasCurrentAccess() && !requestInFlight && !lastSuccess) queueMicrotask(() => refresh());
    return heading + `<div id="playerSessionRoot">${contentMarkup()}</div><input type="file" id="playerSessionAccessFile" accept=".json,application/json" hidden>`;
  }
  function summary() {
    const own = snapshot?.self;
    const title = !ONLINE ? 'Сессия доступна в онлайн-терминале' : snapshot?.mission?.title || (hasCurrentAccess() ? 'Игровая комната подключена' : 'Подключись к своей группе');
    return `<a href="#session" class="panel session-home-summary" data-session-home-summary><span class="session-summary-icon" aria-hidden="true">⌁</span><div><span class="eyebrow">ИГРОВАЯ СЕССИЯ</span><strong>${safeText(title)}</strong><small>${snapshot && own ? safeText(snapshot.name) + ' · ' + safeText(own.xp || 0) + ' XP' : 'Открой приглашение ведущего: миссии и награды появятся здесь.'}</small></div><span class="session-summary-arrow" aria-hidden="true">↗</span></a>`;
  }
  function stats() {
    const self = snapshot?.self;
    if (!self || !hasCurrentAccess()) return '<div data-session-character-rewards hidden></div>';
    return `<section class="panel session-character-rewards" data-session-character-rewards><div><span class="eyebrow">ИЗ ИГРОВОЙ СЕССИИ</span><strong>${safeText(self.xp || 0)} XP</strong><p>${safeText(snapshot.name)} · ${safeText(self.name)}</p></div><a class="button ghost small" href="#session">Награды и снаряжение ↗</a></section>`;
  }

    return heading + `<form class="panel fallout-sheet" id="falloutSheetForm"><div class="sheet-masthead"><div class="sheet-brand"><h2>Fallout</h2><small>ПЕРСОНАЛЬНОЕ ДЕЛО ВЫЖИВШЕГО</small></div><span class="sheet-document-id">S.P.E.C.I.A.L. // 2207<br>АВТОМАТИЧЕСКИЙ РАСЧЁТ ПО ПРАВИЛАМ</span></div><section class="sheet-portrait-panel" data-sheet-portrait aria-label="Арт персонажа">${portraitMarkup(sheet)}</section><div class="sheet-top"><div class="sheet-identity">${field('name', 'Имя', sheet)}${field('gender', 'Пол', sheet)}${field('age', 'Возраст', sheet, {numeric:true})}</div><div class="sheet-combat-summary">${field('initiative', 'Инициатива · авто', sheet, {readonly:true})}${field('action_points', 'Очки действия · авто', sheet, {readonly:true,after:`<small data-movement-ap>${result.movementAP ? '+'+result.movementAP+' ОД только на передвижение' : 'Общие ОД на ход'}</small>`})}${field('armor_class', 'Класс брони · авто', sheet, {readonly:true})}${experienceMarkup(sheet,result)}${field('level', 'Уровень · авто', sheet, {readonly:true})}<label class="sheet-field" for="sheet-health-current"><span>Здоровье · текущее / максимум</span><span class="sheet-health-control"><input class="input" type="number" step="any" inputmode="decimal" id="sheet-health-current" data-health-current aria-label="Текущее здоровье" value="${result.currentHP===null?'':result.currentHP}"><output data-health-max>/ ${result.maxHP}</output></span><small>Максимум считается; текущее не лечится при повышении уровня.</small></label></div></div><div id="sheetAdvancement">${progressMarkup(sheet,result)}</div><div class="sheet-rule-notices" data-rules-warnings aria-live="polite">${warningsMarkup(result)}</div><div class="sheet-body">${specialMarkup(sheet)}<div class="sheet-notes-column"><section class="sheet-notebox sheet-traits" id="sheetTraits">${traitMarkup(sheet)}</section><section class="sheet-notebox sheet-perks" id="sheetPerks">${perkMarkup(sheet)}</section><section class="sheet-notebox sheet-wounds">${sectionTitle('Ранения')}${field('wounds', '<span class="sr-only">Ранения</span>', sheet, {multiline:true, rows:6})}</section>${legacyNotes()}</div>${skillsMarkup(sheet)}</div><div id="falloutSheetEquipment">${equipmentMarkup(sheet)}</div><details class="sheet-formulas"><summary>Как считается анкета</summary><p>Модификатор S.P.E.C.I.A.L. = итог − 5. Максимум здоровья = 15 + 3 × В + (уровень − 1) × В + бонусы. ОД = 5 + ⌊Л / 2⌋ + бонусы. Инициатива = Восприятие + d20; кубик бросается в игре.</p><p>КБ = КБ экипированной брони + бонус ловкости + постоянные бонусы. Без брони бонус равен ловкости; кожаная куртка — ⌊Л/2⌋, кожаная боевая куртка — ⌊Л/3⌋, кожаная броня — ⌊Л/4⌋, кожаная броня МК2 — ⌊Л/6⌋. «Камикадзе» исключает бонус ловкости к КБ и прибавляет ловкость к инициативе.</p><p>В таблице опыта: 1 — 200; 2 — 400; 3 — 800; 4 — 1400; 5 — 2200; 6 — 3200; 7 — 4400; 8 — 5800; 9 — 7400; 10 — 9100; 11 — 11000; 12 — 13100; 13 — 15400; 14 — 17900; 15 — 20600. Создание начинается с 1-го уровня: при 0–399 XP показан 1-й уровень. Выше 15-го формулы опыта в файле нет.</p><p>Стартовый опыт — уже полученная сумма. «Светоч» делит новый опыт сессии на два; округление в правилах не указано, поэтому сохраняется точная половина. Серверная запись опыта остаётся исходной.</p></details><div class="sheet-footer"><button class="button primary" type="submit">Сохранить анкету ↗</button><button type="button" class="button ghost small sheet-delete-character" data-sheet-progress-action="delete-character">Удалить персонажа</button><span class="sheet-save-status" id="falloutSheetSaveStatus" role="status">Изменения сохраняются автоматически в этом браузере.</span></div><p class="sheet-storage-note">Расчёты — по твоим «Правилам игры» и «Перкам». Лист и последний полученный опыт сохраняются в браузере и входят в резервную копию. Награды приходят с сервера автоматически.</p></form>`;
  }
  function warningsMarkup(result) { return result.warnings.length ? result.warnings.map(text=>`<p class="sheet-warning">${escapeText(text)}</p>`).join('') : '<p class="sheet-rules-help">Постоянные бонусы особенностей и перков учтены в итогах.</p>'; }
  function scheduleSave() {
    const status=document.getElementById('falloutSheetSaveStatus');
    const allocation=showAllocationValidation();
    if(status) status.textContent=allocation.valid ? 'Сохраняю изменения…' : 'Анкета не сохранена. '+allocation.error;
    clearTimeout(saveTimer);
    if(!allocation.valid) {saveTimer=0;return;}
    saveTimer=setTimeout(()=>persist(),400);
  }
  function acceptField(target) {
    const sheet=currentSheet(),name=target.dataset.sheetField;
    if (target.dataset.training) {
      if(!RULES.SKILLS.includes(target.dataset.training)) return;
      sheet.rules.training[target.dataset.training]=String(target.value).slice(0,40);
    } else if(target.hasAttribute('data-health-current')) {
      sheet.health=target.value.trim()==='' ? '' : target.value+' / '+calculation(sheet).maxHP;
    } else {
      if(!FIELD_SET.has(name) || target.readOnly) return;
      sheet[name]=TAG_FIELDS.has(name) ? target.checked : String(target.value).slice(0,limitFor(name));
    }
    updateSessionParts();
    scheduleSave();
  }
  function refreshSelectors() {
    const sheet=currentSheet();
    const traits=document.getElementById('sheetTraits');
    if(traits) traits.innerHTML=traitMarkup(sheet);
    const perks=document.getElementById('sheetPerks');
    if(perks) { const wasOpen=!!perks.querySelector('.sheet-catalog[open]');perks.innerHTML=perkMarkup(sheet);if(wasOpen)perks.querySelector('.sheet-catalog')?.setAttribute('open',''); }
  }
  function updateSessionParts() {
    processProgress();
    if(document.querySelector('[data-sheet-perk-dialog]'))refreshPerkDialog();
    if(document.querySelector('[data-sheet-special-dialog]'))refreshSpecialDialog();
    const form=document.getElementById('falloutSheetForm');
    if(!form) return;
    const sheet=currentSheet(),result=applyCalculated(sheet);
    updateLegacyProfile(sheet,result);
    for(const name of ['initiative','action_points','armor_class','level']) {const input=document.getElementById('sheet-'+name);if(input)input.value=sheet[name];}
    const total=document.getElementById('sheet-experience-total');if(total)total.value=String(result.totalXP);
    const xp=form.querySelector('[data-sheet-xp]');if(xp)xp.innerHTML=xpBreakdown(sheet);
    const advancement=document.getElementById('sheetAdvancement');if(advancement){const markup=progressMarkup(sheet,result);if(advancement.innerHTML!==markup)advancement.innerHTML=markup;}
    const health=form.querySelector('[data-health-max]');if(health)health.textContent='/ '+result.maxHP;
    const movement=form.querySelector('[data-movement-ap]');if(movement)movement.textContent=result.movementAP ? '+'+result.movementAP+' ОД только на передвижение' : 'Общие ОД на ход';
    for(const [letter] of SPECIAL_ROWS) {const mod=form.querySelector(`[data-special-mod="${letter}"]`);if(mod)mod.value=signed(result.modifiers[letter]);}
    for(const [id] of SKILLS) {const total=form.querySelector(`[data-skill-total="${id}"]`),bonus=form.querySelector(`[data-skill-bonus="${id}"]`);if(total)total.textContent=signed(result.skills[id]);if(bonus)bonus.textContent=result.bonus[id] ? signed(result.bonus[id])+' от особенностей / перков' : 'Без постоянного бонуса';}
    const special=form.querySelector('[data-special-budget]');if(special)special.textContent=specialBudget(result);
    const skills=form.querySelector('[data-skill-budget]');if(skills)skills.textContent=skillBudget(result);
    const warnings=form.querySelector('[data-rules-warnings]');if(warnings)warnings.innerHTML=warningsMarkup(result);
    showAllocationValidation(sheet,result);
    const equipment=document.getElementById('falloutSheetEquipment');
    if(equipment && (currentRoom() || !equipment.contains(document.activeElement))) {const markup=equipmentMarkup(sheet);if(equipment.innerHTML!==markup)equipment.innerHTML=markup;}
    const perkSection=document.getElementById('sheetPerks');
    if(perkSection && !perkSection.contains(document.activeElement)) {const open=!!perkSection.querySelector('.sheet-catalog[open]');perkSection.innerHTML=perkMarkup(sheet);if(open)perkSection.querySelector('.sheet-catalog')?.setAttribute('open','');}
  }
  document.addEventListener('input',event=>{
    const target=event.target;
    if(!target.closest('#falloutSheetForm'))return;
    if(target.matches('[data-sheet-field],[data-training],[data-health-current]') && target.type!=='checkbox')acceptField(target);
    if(target.hasAttribute('data-perk-search')) {perkSearch=target.value.slice(0,100);selectedPerk='';const preview=target.closest('.sheet-catalog')?.querySelector('.sheet-rule-preview');if(preview)preview.innerHTML='<p>Выбери перк, чтобы увидеть эффект и требования.</p>';const select=document.getElementById('sheet-perk-choice');if(select){select.innerHTML='<option value="">Выбери перк</option>'+RULES.PERKS.filter(perk=>!currentSheet().rules.perks.some(entry=>entry.id===perk.id) && (perk.name+' '+perk.description).toLocaleLowerCase('ru').includes(perkSearch.toLocaleLowerCase('ru'))).map(perk=>`<option value="${perk.id}">${escapeText(perk.name)} · ур. ${perk.level}</option>`).join('');}}
  });
  document.addEventListener('change',event=>{
    const target=event.target;
    if(!target.closest('#falloutSheetForm'))return;
    if(target.matches('[data-sheet-field]') && target.type==='checkbox')acceptField(target);
    if(target.hasAttribute('data-trait-choice')) {selectedTrait=target.value;refreshSelectors();document.getElementById('sheet-trait-choice')?.focus();}
    if(target.hasAttribute('data-perk-choice')) {selectedPerk=target.value;refreshSelectors();document.getElementById('sheetPerks')?.querySelector('.sheet-catalog')?.setAttribute('open','');document.getElementById('sheet-perk-choice')?.focus();}
    const meta=currentSheet().rules;
    if(!meta.traitsLocked && target.hasAttribute('data-thief-subtype')) {meta.thiefSubtype=target.value;updateSessionParts();scheduleSave();}
    if(!meta.traitsLocked && target.dataset.thiefSkill) {const id=target.dataset.thiefSkill;if(target.checked && !meta.thiefSkills.includes(id)){if(meta.thiefSkills.length>=2){target.checked=false;return;}meta.thiefSkills.push(id);}else if(!target.checked)meta.thiefSkills=meta.thiefSkills.filter(key=>key!==id);updateSessionParts();scheduleSave();}
  });
  document.addEventListener('click',event=>{
    const target=event.target.closest('[data-add-trait],[data-remove-trait],[data-add-perk],[data-add-rank]');
    if(!target || !target.closest('#falloutSheetForm'))return;
    const sheet=currentSheet(),meta=sheet.rules,result=calculation(sheet);
    if(target.dataset.addTrait && !meta.traitsLocked && meta.traits.length<2 && RULES.TRAITS.some(trait=>trait.id===target.dataset.addTrait) && !meta.traits.includes(target.dataset.addTrait)){meta.traits.push(target.dataset.addTrait);selectedTrait='';}
    if(target.dataset.removeTrait && !meta.traitsLocked)meta.traits=meta.traits.filter(id=>id!==target.dataset.removeTrait);
    const used=meta.perks.reduce((sum,entry)=>sum+entry.rank,0),addId=target.dataset.addPerk || target.dataset.addRank;
    if(addId && !allocationState(sheet,result).valid) {showAllocationValidation(sheet,result);if(typeof toast==='function')toast(allocationState(sheet,result).error);return;}
    if(addId && used<result.perkBudget) {const perk=RULES.PERKS.find(entry=>entry.id===addId),existing=meta.perks.find(entry=>entry.id===addId);if(perk && !RULES.eligibility(perk,result,(existing?.rank || 0)+1).length){const previous=meta.perks.map(entry=>({...entry}));if(existing)existing.rank++;else meta.perks.push({id:addId,rank:1});applyCalculated(sheet);if(!persist()){meta.perks=previous;applyCalculated(sheet);updateLegacyProfile(sheet);if(typeof toast==='function')toast('Не удалось сохранить выбор перка. Попробуй ещё раз.');}else selectedPerk='';refreshSelectors();updateSessionParts();return;}}
    applyCalculated(sheet);refreshSelectors();updateSessionParts();scheduleSave();
  });
  document.addEventListener('submit',event=>{
    if(event.target.id!=='falloutSheetForm')return;
    event.preventDefault();
    const sheet=currentSheet();
    if(sheet.rules.traits.includes('thief') && (!sheet.rules.thiefSubtype || sheet.rules.thiefSkills.length!==2)) {if(typeof toast==='function')toast('Для «Вора» выбери подтип и два навыка.');return;}
    persist(true);
  });
  document.addEventListener('click',event=>{
    if(event.target.closest('[data-sheet-special-action="choose"]'))openSpecialDialog();
    const specialOption=event.target.closest('[data-special-choice]');
    if(specialOption && !specialOption.disabled) {specialChoice=specialOption.dataset.specialChoice;refreshSpecialDialog();}
    const action=event.target.closest('[data-sheet-progress-action]')?.dataset.sheetProgressAction;
    if(action==='choose-perk')openPerkDialog();
    if(action==='open-sheet') {if(location.hash!=='#character')location.hash='character';else document.getElementById('falloutSheetForm')?.scrollIntoView({behavior:'smooth',block:'start'});}
    if(action==='acknowledge') {const progress=progression();progress.acknowledgedLevel=progress.observedLevel;if(typeof save==='function')save();mountLevelNotice();updateSessionParts();}
    if(action==='delete-character')confirmDeleteCharacter();
    const choice=event.target.closest('[data-perk-dialog-select]');
    if(choice) {perkDialogSelection=choice.dataset.perkDialogSelect;refreshPerkDialog();}
  });
  document.addEventListener('input',event=>{if(event.target.hasAttribute('data-perk-dialog-search')){perkDialogSearch=event.target.value.slice(0,100);refreshPerkDialog();}});
  document.addEventListener('change',event=>{if(event.target.hasAttribute('data-perk-dialog-available')){perkDialogAvailableOnly=event.target.checked;refreshPerkDialog();}});
  window.addEventListener('niti:session-update',event=>{rememberedRoom=event.detail?.room?.self ? event.detail.room : null;updateSessionParts();});
  window.addEventListener('pagehide',()=>{if(saveTimer)persist();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden && saveTimer)persist();});
  window.playerRulesEffectivePerception=()=>calculation().special.P;
  window.playerSheetValidPortrait = validPortrait;
  window.playerSheetPublicPersona = publicPersona;
  window.playerSheetPage = page;
  window.playerSheetValid = validSheet;
  window.playerSheetNormalize = normalizeSheet;
  window.playerSheetAllocationState = allocationState;
  window.playerSheetRefresh = updateSessionParts;
  window.playerSheetResetProgress=()=>{const key=specialPromptKey();specialPrompts.delete(key);try{localStorage.removeItem(key);}catch{}clearTimeout(saveTimer);clearTimeout(promptTimer);saveTimer=0;promptTimer=0;progressSignature='';specialChoice='';rememberedRoom=null;document.getElementById('sheetProgressNotice')?.remove();};
})();

  function stop() {
    if (activeAnimation) activeAnimation.cancel();
    activeWorkspace?.classList.remove('niti-navigation-active');
    activeAnimation = null;
    activeWorkspace = null;
  }
  function navigate(view) {
    const next = String(view || '');
    const changed = previousView !== null && previousView !== next;
    previousView = next;
    stop();

    if (!workspace || typeof workspace.animate !== 'function') return;
    workspace.classList.add('niti-navigation-active');

      activeWorkspace = null;
    };
    animation.finished.then(finish, finish);

  window.nitiAnimateNavigation = navigate;

 class="button ghost" href="#notes">Сделать заметку ↗</a></div></div></section><section class="panel player-profile-summary"><div class="panel-header"><h2 class="panel-title">Мой персонаж</h2><a class="text-button" href="#character">Заполнить ↗</a></div><div class="player-profile-summary-body"><div class="player-summary-label">ИМЯ В АРХИВЕ</div><h2 class="player-summary-name">${esc(p.name)||'Пока без имени'}</h2><p class="muted">${esc(p.concept)||'Перенеси имя и характеристики из своего игрового листа.'}</p><div class="player-summary-stats">${SPECIAL.map(([k,n])=>`<div class="player-summary-stat" title="${n}"><small>${k}</small><strong>${p.special[k]}</strong></div>`).join('')}</div><p class="player-local-notice">${player.notes.length} личных заметок. Записи видны только в твоём браузере.</p></div></section></div><div class="player-tools"><a class="panel" href="#character">${icon('character')}<strong>Твой персонаж</strong><span>Характеристики, навыки и состояние.</span><b>↗</b></a><a class="panel" href="#notes">${icon('notes')}<strong>Твоя память</strong><span>Имена, обещания и собственные наблюдения.</span><b>↗</b></a><a class="panel" href="#dice">${icon('dice')}<strong>Твой шанс</strong><span>d4, d6, d8, d10, d12, d20 и d100.</span><b>↗</b></a></div><div class="banner"><strong>Личный архив.</strong> У каждого участника свои записи. Для переноса на другое устройство скачай копию данных в разделе «Справка».</div>`;}
function inputField(name,label,value='',type='input'){return `<div class="field"><label class="field-label" for="p-${name}">${label}</label>${type==='textarea'?`<textarea class="textarea" id="p-${name}" name="${name}" rows="4" maxlength="30000">${esc(value)}</textarea>`:`<input class="input" id="p-${name}" name="${name}" maxlength="300" value="${esc(value)}">`}</div>`;}
function character(){return playerSheetPage();}
window.playerClearCharacter=()=>{const notes=player.notes;window.playerSheetResetProgress?.();player=initial();player.notes=notes;persistedCharacter=characterSnapshot(player);resetCharacterStorage=true;identityAuthored=false;acceptedIdentitySignature=JSON.stringify(publicIdentity());save();resetCharacterStorage=false;closeModal();render();window.dispatchEvent(new CustomEvent('niti:character-cleared'));};
function notes(){return head('ТО, ЧТО ТЫ УЖЕ ЗНАЕШЬ','Мои заметки.','Записывай события, договорённости и вопросы, которые хочешь задать на следующей встрече.')+`<section class="panel player-notes-form"><form id="noteForm">${inputField('noteTitle','КОРОТКИЙ ЗАГОЛОВОК')}${inputField('noteText','ЗАПИСЬ','','textarea')}<button class="button primary" type="submit">Добавить заметку ↗</button></form></section><div class="player-note-list">${player.notes.map(n=>`<article class="panel player-note"><div class="card-top"><span class="muted">${esc(new Date(n.date).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}))}</span><div class="player-note-actions">${btn('Изменить','edit-note','ghost small',`data-id="${esc(n.id)}"`)}${btn('×','delete-note','ghost small',`data-id="${esc(n.id)}" aria-label="Удалить заметку"`)}</div></div><h2 class="card-title">${esc(n.title)||'Заметка'}</h2><p class="prewrap">${esc(n.text)}</p></article>`).join('')||'<div class="empty-state"><h3>Чистая страница.</h3><p>Первая запись появится здесь после сохранения.</p></div>'}</div>`;}
function help(){return head('ПАМЯТКА УЧАСТНИКА','Всегда под рукой.','Личные инструменты и сохранения для твоей игры.')+`<div class="player-help-grid"><section class="panel"><h2 class="card-title">Проверки</h2><p>Характеристика: <strong>1d20 + (SPECIAL − 5)</strong>.<br>Навык: <strong>1d20 + значение навыка</strong>.</p><p>Навык и характеристика одновременно не складываются. Итог сравнивается с порогом, который задаёт ведущий. Особенности и снаряжение учитывайте по правилам вашей группы.</p><p class="muted">Кубики показывают результат броска. Условия успеха определяются за столом.</p></section><section class="panel"><h2 class="card-title">Цвет и экран</h2><p>В верхней панели доступны 10 оттенков терминала. Кнопка «ЭЛТ» включает и отключает декоративные полосы экрана.</p><p>Настройки сохраняются для этого браузера.</p></section><section class="panel"><h2 class="card-title">Личные сохранения</h2><p>Анкета и заметки хранятся на этом устройстве. В «Моём отряде» участники видят арт, имя, возраст, пол персонажа и имя владельца. Мастеру также передаются исходный опыт и влияние особенности «Светоч» для повышения уровня. Миссия, полученный опыт и вещи хранятся на сервере. История кубиков ведётся отдельно.</p><p>Очистка данных браузера удаляет локальные записи. Скачай резервную копию перед переносом на другое устройство.</p><div class="player-data-actions">${btn('↓ Скачать мои данные','backup','primary')}${btn('↥ Восстановить копию','restore','ghost')}</div></section><section class="panel"><h2 class="card-title">Без интернета</h2><p>Скачай терминал одним HTML-файлом. Для переноса персонажа и заметок также сохрани и восстанови резервную копию.</p></section></div>`;}
function render(){if(!pages.some(([id])=>id===view))view='home';$('#nav').innerHTML=pages.map(([id,name])=>`<a class="nav-item ${id===view?'active':''}" href="#${id}" ${id===view?'aria-current="page"':''}>${icon(id)}<span>${name}</span></a>`).join('');const name=pages.find(([id])=>id===view)[1];$('#crumb').textContent=name;document.title=name+' · Нити — игрок';$('#workspace').innerHTML=({home,session:playerSessionPage,character,squad:playerSquadPage,inventory:playerInventoryPage,notes,dice:dicePage,help}[view])();$('#saveStatus').textContent=storageOK?'● Личные записи в браузере':'! Не сохранено · скачай копию';window.nitiAnimateNavigation?.(view);window.NitiDesign?.render(view);}
function navigate(id){if(location.hash.slice(1)===id){view=id;render();}else location.hash=id;}
window.addEventListener('hashchange',()=>{view=location.hash.slice(1);render();window.scrollTo(0,0);});
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function backup(){const prepared=playerArchiveState();download('niti-player-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(prepared.data,null,2));if(prepared.error)toast('Копия содержит последнюю сохранённую анкету. '+prepared.error);}
function modal(title,body,submit){lastFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="modal-header"><h2 id="dialogTitle">${title}</h2>${btn('×','close-modal','ghost','aria-label="Закрыть"')}</div><form id="dialogForm"><div class="modal-body">${body}</div><div class="modal-footer">${btn('Отмена','close-modal','ghost')}<button class="button primary" type="submit">Сохранить</button></div></form></section></div>`;document.body.style.overflow='hidden';$('#dialogForm').onsubmit=e=>{e.preventDefault();submit(new FormData(e.currentTarget));};$('#modalRoot button').focus();}
function closeModal(){$('#modalRoot').innerHTML='';document.body.style.overflow='';lastFocus?.focus();}
document.addEventListener('click',event=>{const b=event.target.closest('[data-player-action]');if(!b)return;const action=b.dataset.playerAction,id=b.dataset.id;if(action==='backup')backup();if(action==='restore')$('#playerBackupFile').click();if(action==='close-modal')closeModal();if(action==='edit-note'){const n=player.notes.find(n=>n.id===id);if(!n)return;modal('Изменить заметку',inputField('editTitle','ЗАГОЛОВОК',n.title)+inputField('editText','ЗАПИСЬ',n.text,'textarea'),f=>{const text=String(f.get('editText')||'').trim();if(!text){toast('Добавь текст заметки.');return;}n.title=String(f.get('editTitle')||'').trim().slice(0,200);n.text=text;save();closeModal();render();});}if(action==='delete-note')modal('Удалить заметку?','<p>Эта запись будет удалена из личного архива.</p>',()=>{player.notes=player.notes.filter(n=>n.id!==id);save();closeModal();render();});});
document.addEventListener('submit',event=>{if(event.target.id==='profileForm'){event.preventDefault();const f=new FormData(event.target),profile={...player.profile,special:{}};for(const name of ['name','concept','hp','defence','inventory','description'])profile[name]=String(f.get(name)||'').trim();for(const[k]of SPECIAL){const n=Number(f.get('special-'+k));if(!Number.isInteger(n)||n<1||n>10){toast('Характеристики должны быть целыми числами от 1 до 10.');return;}profile.special[k]=n;}player.profile=profile;const success=save();$('#profileStatus').textContent=success?'Персонаж сохранён.':'Не удалось сохранить. Скачай копию данных.';}if(event.target.id==='noteForm'){event.preventDefault();const f=new FormData(event.target),text=String(f.get('noteText')||'').trim();if(!text){toast('Добавь текст заметки.');return;}if(player.notes.length>=1000){toast('Архив заполнен. Скачай копию и удали ненужные записи.');return;}player.notes.unshift({id:uid(),title:String(f.get('noteTitle')||'').trim().slice(0,200),text,date:new Date().toISOString()});save();render();toast('Заметка добавлена.');}});
document.addEventListener('input',event=>{if(!event.target.id.startsWith('special-'))return;const key=event.target.id.slice(8),n=Number(event.target.value),label=document.querySelector('[data-special-mod="'+key+'"]');if(label)label.textContent=Number.isInteger(n)&&n>=1&&n<=10?'Модификатор '+modifier(n):'От 1 до 10';});
$('#playerBackupFile').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error();const data=JSON.parse(await file.text());if(!validPlayer(data))throw Error();modal('Восстановить личный архив?','<p>Персонаж и заметки будут заменены данными из выбранной копии. Текущий архив можно скачать перед восстановлением.</p>',()=>{const restored={kind:'niti-player',version:1,profile:{...data.profile,special:{...data.profile.special}},notes:data.notes.map(n=>({id:n.id,title:n.title,text:n.text,date:n.date})),sheet:playerSheetNormalize(data.sheet,data.profile)};restored.sheet.rules.itemEffects=[...new Set([...storedItemReceipts(),...(persistedCharacter.sheet?.rules?.itemEffects || []),...(restored.sheet.rules.itemEffects || [])])].slice(0,5000);const error=characterSaveError(restored);if(error){toast('Копия не восстановлена. '+error);return;}backup();const previous=player;player=restored;if(!save()){player=previous;toast('Не удалось сохранить восстановленную анкету. Текущие данные оставлены.');return;}closeModal();render();toast('Личный архив восстановлен.');});}catch{toast('Нужна резервная копия терминала игрока в формате JSON.');}event.target.value='';});
document.addEventListener('keydown',event=>{if(!$('#modalRoot').children.length)return;if(event.key==='Escape')closeModal();if(event.key==='Tab'){const buttons=[...$('#modalRoot').querySelectorAll('button,input,textarea,select,a[href]')].filter(node=>!node.disabled&&node.tabIndex>=0&&node.getClientRects().length),first=buttons[0],last=buttons.at(-1);if(!first)return;if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
render();
</script>
</body></html>
