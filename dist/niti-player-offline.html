function diceValidRecord(r){return !!r&&typeof r.id==='string'&&r.id.length>0&&r.id.length<120&&DICE_SIDES.includes(r.sides)&&Number.isInteger(r.count)&&r.count>=1&&r.count<=20&&Number.isInteger(r.modifier)&&r.modifier>=-100&&r.modifier<=100&&Array.isArray(r.rolls)&&r.rolls.length===r.count&&r.rolls.every(n=>Number.isInteger(n)&&n>=1&&n<=r.sides)&&Number.isInteger(r.sum)&&r.sum===r.rolls.reduce((a,b)=>a+b,0)&&Number.isInteger(r.total)&&r.total===r.sum+r.modifier&&typeof r.date==='string'&&r.date.length<60&&Number.isFinite(Date.parse(r.date));}
const diceSession=(()=>{let history=[];try{const raw=localStorage.getItem('niti-dice-v1');if(raw&&raw.length<65536){const parsed=JSON.parse(raw);if(Array.isArray(parsed))history=parsed.filter(diceValidRecord).slice(0,20);}}catch{}return{history,last:history[0]||null,selected:20,count:'1',modifier:'0',open:false,error:'',message:'',storageOK:true,serial:0};})();
function diceFormula(sides,count,modifier){return `${count}d${sides}${modifier>0?' + '+modifier:modifier<0?' − '+Math.abs(modifier):''}`;}
function diceShape(sides){const shapes={4:'M32 5 58 52H6Zm0 0v31L6 52m26-16 26 16',6:'m32 4 25 14v29L32 61 7 47V18Zm0 28L7 18m25 14 25-14M32 32v29',8:'m32 3 24 29-24 29L8 32Zm0 0 12 29-12 29-12-29Zm-24 29h48',10:'m32 4 24 23-24 33L8 27Zm0 0v33m0 0L8 27m24 10 24-10',12:'m32 3 26 19-10 31H16L6 22Zm0 0 13 19-5 23H24l-5-23Zm-13 19L6 22m39 0 13 0M24 45l-8 8m24-8 8 8M32 3v10',20:'m32 3 27 16-10 34H15L5 19Zm0 0 13 18-26 0Zm-13 18 13 24 13-24M5 19l14 2-4 32m30-32 14-2M32 45l17 8M32 45l-17 8',100:'m32 4 24 23-24 33L8 27Zm0 0v33m0 0L8 27m24 10 24-10'};return `<svg class="dice-symbol" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${shapes[sides]}"/></svg>`;}
function diceResultHTML(){const r=diceSession.last;if(!r)return `<div class="dice-result-empty"><span class="dice-empty-mark">?</span><h2>Шанс ждёт твоего хода.</h2><p>Выбери кубик. Результат появится здесь.</p></div>`;return `<div class="dice-result-heading"><span class="eyebrow">ПОСЛЕДНИЙ БРОСОК</span><span class="tag">${diceFormula(r.sides,r.count,r.modifier)}</span></div><div class="dice-total">${r.total}</div><div class="dice-calculation">${r.count>1?`${r.rolls.join(' + ')} = ${r.sum}`:'Выпало '+r.sum}${r.modifier?`<span>Модификатор: ${r.modifier>0?'+':''}${r.modifier}</span>`:''}</div><div class="dice-faces" aria-label="Отдельные результаты">${r.rolls.map((n,i)=>`<span class="dice-face ${n===r.sides?'dice-face-max':''}" title="Кубик ${i+1}: ${n}">${n}</span>`).join('')}</div><button type="button" class="button primary dice-repeat" data-dice-action="repeat">Повторить ${diceFormula(r.sides,r.count,r.modifier)}</button>`;}
function diceHistoryHTML(){return diceSession.history.length?`<ol class="dice-history-list" tabindex="0" aria-label="История последних бросков">${diceSession.history.map(r=>`<li class="dice-history-row"><span class="dice-history-formula">${diceFormula(r.sides,r.count,r.modifier)}<small>${r.rolls.join(', ')}${r.modifier?' · мод. '+(r.modifier>0?'+':'')+r.modifier:''}</small></span><strong>${r.total}</strong><time datetime="${esc(r.date)}">${esc(new Date(r.date).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}))}</time></li>`).join('')}</ol>`:`<div class="dice-history-empty">Здесь будут последние 20 бросков.</div>`;}
function diceCardConfig(){const count=Number(diceSession.count),modifier=Number(diceSession.modifier);return diceSession.count.trim()&&diceSession.modifier.trim()&&Number.isInteger(count)&&count>=1&&count<=20&&Number.isInteger(modifier)&&modifier>=-100&&modifier<=100?{count,modifier}:{count:1,modifier:0};}
function diceUpdateCardLabels(){const config=diceCardConfig();document.querySelectorAll('[data-dice-sides]').forEach(button=>{const sides=Number(button.dataset.diceSides),formula=diceFormula(sides,config.count,config.modifier);button.setAttribute('aria-label','Бросить '+formula);button.querySelector('strong').textContent=formula;button.querySelector('span').textContent='от '+(config.count+config.modifier)+' до '+(config.count*sides+config.modifier);});const summary=document.querySelector('.dice-options>summary>span');if(summary)summary.textContent=config.count===1&&config.modifier===0?'необязательно':config.count+' куб. · мод. '+(config.modifier>0?'+':'')+config.modifier;}
function dicePage(){const cfg=diceCardConfig();return head('МОДУЛЬ СЛУЧАЙНЫХ СОБЫТИЙ','Кубики. Твой следующий ход.','Семь кубиков на одном экране. Выбери нужный и бросай, когда этого требует история.')+`<div class="dice-workspace"><section class="panel dice-console"><div class="panel-header"><h2 class="panel-title">Выбери кубик</h2><span class="tag">d4 — d100</span></div><div class="dice-picker">${DICE_SIDES.map(s=>`<button type="button" class="dice-card ${diceSession.selected===s?'selected':''}" data-dice-action="roll" data-dice-sides="${s}" aria-pressed="${diceSession.selected===s}" aria-label="Бросить ${diceFormula(s,cfg.count,cfg.modifier)}">${diceShape(s)}<strong>${diceFormula(s,cfg.count,cfg.modifier)}</strong><span>от ${cfg.count+cfg.modifier} до ${cfg.count*s+cfg.modifier}</span></button>`).join('')}</div><details class="dice-options" ${diceSession.open?'open':''}><summary>Несколько кубиков и модификатор <span>${cfg.count===1&&cfg.modifier===0?'необязательно':cfg.count+' куб. · мод. '+(cfg.modifier>0?'+':'')+cfg.modifier}</span></summary><form id="diceOptionsForm" novalidate><div class="dice-option-fields"><label><span class="field-label">КОЛИЧЕСТВО · 1–20</span><input class="input" type="number" id="diceCount" name="count" min="1" max="20" step="1" value="${esc(diceSession.count)}" inputmode="numeric" aria-describedby="diceOptionHint"></label><label><span class="field-label">МОДИФИКАТОР · −100…100</span><input class="input" type="number" id="diceModifier" name="modifier" min="-100" max="100" step="1" value="${esc(diceSession.modifier)}" inputmode="numeric" aria-describedby="diceOptionHint"></label></div><p id="diceOptionHint">Количество и модификатор применяются к следующему выбранному кубику. Например: 2d6 + 3.</p><button class="button ghost small" type="submit">Бросить выбранный d${diceSession.selected}</button></form></details><div class="dice-console-note">Броски хранятся здесь отдельно от сюжетного журнала.</div></section><section class="panel dice-result-panel"><div class="panel-header"><h2 class="panel-title">Результат</h2><span class="dice-signal">● ГОТОВ К БРОСКУ</span></div><div class="dice-result-content" id="diceResult">${diceResultHTML()}</div><div class="dice-live" id="diceLive" role="status" aria-live="polite" aria-atomic="true">${esc(diceSession.error||diceSession.message)}</div></section><section class="panel dice-history-panel"><div class="panel-header"><h2 class="panel-title">История бросков <span class="badge" id="diceHistoryCount">${diceSession.history.length}</span></h2><button type="button" class="text-button" data-dice-action="clear" ${diceSession.history.length?'':'disabled'}>Очистить</button></div><div id="diceHistory">${diceHistoryHTML()}</div><div class="dice-history-note" id="diceHistoryNote">${diceSession.storageOK?'Последние 20 результатов сохраняются в этом браузере.':'История доступна до закрытия вкладки: браузер не разрешил сохранение.'}</div></section></div>`;}
function diceSaveHistory(){try{localStorage.setItem('niti-dice-v1',JSON.stringify(diceSession.history));diceSession.storageOK=true;}catch{diceSession.storageOK=false;}}
function diceReadOptions(){const c=document.getElementById('diceCount'),m=document.getElementById('diceModifier');if(c)diceSession.count=c.value;if(m)diceSession.modifier=m.value;const count=Number(diceSession.count),modifier=Number(diceSession.modifier);c?.removeAttribute('aria-invalid');m?.removeAttribute('aria-invalid');if(!diceSession.count.trim()||!Number.isInteger(count)||count<1||count>20){c?.setAttribute('aria-invalid','true');c?.focus();throw new Error('Укажи целое количество от 1 до 20.');}if(!diceSession.modifier.trim()||!Number.isInteger(modifier)||modifier<-100||modifier>100){m?.setAttribute('aria-invalid','true');m?.focus();throw new Error('Модификатор должен быть целым числом от −100 до 100.');}return{count,modifier};}
function diceRefresh(){const result=document.getElementById('diceResult'),history=document.getElementById('diceHistory'),live=document.getElementById('diceLive');if(result)result.innerHTML=diceResultHTML();if(history)history.innerHTML=diceHistoryHTML();if(live){live.textContent=diceSession.error||diceSession.message;live.classList.toggle('dice-error',!!diceSession.error);}const counter=document.getElementById('diceHistoryCount');if(counter)counter.textContent=diceSession.history.length;const clear=document.querySelector('[data-dice-action="clear"]');if(clear)clear.disabled=!diceSession.history.length;const note=document.getElementById('diceHistoryNote');if(note)note.textContent=diceSession.storageOK?'Последние 20 результатов сохраняются в этом браузере.':'История доступна до закрытия вкладки: браузер не разрешил сохранение.';document.querySelectorAll('[data-dice-sides]').forEach(b=>{const chosen=Number(b.dataset.diceSides)===diceSession.selected;b.classList.toggle('selected',chosen);b.setAttribute('aria-pressed',String(chosen));});const form=document.getElementById('diceOptionsForm');if(form)form.querySelector('button').textContent='Бросить выбранный d'+diceSession.selected;}
function diceRoll(sides,repeat=false){if(!DICE_SIDES.includes(sides))return;try{let config;if(repeat&&diceSession.last){config={count:diceSession.last.count,modifier:diceSession.last.modifier};}else config=diceReadOptions();const rolls=Array.from({length:config.count},()=>diceRandomFace(sides));const sum=rolls.reduce((a,b)=>a+b,0);const record={id:Date.now().toString(36)+'-'+(++diceSession.serial),date:new Date().toISOString(),sides,count:config.count,modifier:config.modifier,rolls,sum,total:sum+config.modifier};diceSession.selected=sides;diceSession.last=record;diceSession.history.unshift(record);diceSession.history=diceSession.history.slice(0,20);diceSession.error='';diceSession.message='Бросок '+diceSession.serial+'. '+diceFormula(sides,config.count,config.modifier)+': результат '+record.total+'.'+(config.count>1?' Кубики: '+rolls.join(', ')+'.':'');diceSaveHistory();diceRefresh();if(repeat)document.querySelector('.dice-repeat')?.focus();}catch(error){diceSession.error=error instanceof Error?error.message:'Не удалось выполнить бросок. Попробуй ещё раз.';diceRefresh();}}

ref="#notes">Сделать заметку ↗</a></div></div></section><section class="panel player-profile-summary"><div class="panel-header"><h2 class="panel-title">Мой персонаж</h2><a class="text-button" href="#character">Заполнить ↗</a></div><div class="player-profile-summary-body"><div class="player-summary-label">ИМЯ В АРХИВЕ</div><h2 class="player-summary-name">${esc(p.name)||'Пока без имени'}</h2><p class="muted">${esc(p.concept)||'Перенеси имя и характеристики из своего игрового листа.'}</p><div class="player-summary-stats">${SPECIAL.map(([k,n])=>`<div class="player-summary-stat" title="${n}"><small>${k}</small><strong>${p.special[k]}</strong></div>`).join('')}</div><p class="player-local-notice">${player.notes.length} личных заметок. Записи видны только в твоём браузере.</p></div></section></div><div class="player-tools"><a class="panel" href="#character">${icon('character')}<strong>Твой персонаж</strong><span>Характеристики, состояние и снаряжение.</span><b>↗</b></a><a class="panel" href="#notes">${icon('notes')}<strong>Твоя память</strong><span>Имена, обещания и собственные наблюдения.</span><b>↗</b></a><a class="panel" href="#dice">${icon('dice')}<strong>Твой шанс</strong><span>d4, d6, d8, d10, d12, d20 и d100.</span><b>↗</b></a></div><div class="banner"><strong>Личный архив.</strong> У каждого участника свои записи. Для переноса на другое устройство скачай копию данных в разделе «Справка».</div>`;}
function inputField(name,label,value='',type='input'){return `<div class="field"><label class="field-label" for="p-${name}">${label}</label>${type==='textarea'?`<textarea class="textarea" id="p-${name}" name="${name}" rows="4" maxlength="30000">${esc(value)}</textarea>`:`<input class="input" id="p-${name}" name="${name}" maxlength="300" value="${esc(value)}">`}</div>`;}
function character(){const p=player.profile;return head('ЛИЧНЫЙ ЛИСТ','Мой персонаж.','Удобная запись для игры. Значения определяются вашим игровым листом и правилами группы.')+`<form class="panel player-form" id="profileForm"><div class="player-form-grid">${inputField('name','ИМЯ',p.name)}${inputField('concept','РОЛЬ / КОНЦЕПЦИЯ',p.concept)}${inputField('hp','ОЖ · ТЕКУЩИЕ / МАКСИМУМ',p.hp)}${inputField('defence','ЗАЩИТА / КБ',p.defence)}</div><div class="field-label">S.P.E.C.I.A.L.</div><div class="special-grid">${SPECIAL.map(([k,name])=>`<label class="special-card" for="special-${k}"><strong>${k}</strong><span class="special-name">${name}</span><input id="special-${k}" class="input" type="number" name="special-${k}" min="1" max="10" step="1" required value="${p.special[k]}"><span class="special-mod" data-special-mod="${k}">Модификатор ${modifier(p.special[k])}</span></label>`).join('')}</div><p class="muted">Значения 5 — заготовка для заполнения. Перенеси реальные характеристики своего персонажа.</p>${inputField('inventory','ИНВЕНТАРЬ И СНАРЯЖЕНИЕ',p.inventory,'textarea')}${inputField('description','ОПИСАНИЕ И ЛИЧНЫЕ ДЕТАЛИ',p.description,'textarea')}<div class="player-form-footer"><button class="button primary" type="submit">Сохранить персонажа ↗</button><span class="player-status" id="profileStatus" role="status"></span></div></form>`;}
function notes(){return head('ТО, ЧТО ТЫ УЖЕ ЗНАЕШЬ','Мои заметки.','Записывай события, договорённости и вопросы, которые хочешь задать на следующей встрече.')+`<section class="panel player-notes-form"><form id="noteForm">${inputField('noteTitle','КОРОТКИЙ ЗАГОЛОВОК')}${inputField('noteText','ЗАПИСЬ','','textarea')}<button class="button primary" type="submit">Добавить заметку ↗</button></form></section><div class="player-note-list">${player.notes.map(n=>`<article class="panel player-note"><div class="card-top"><span class="muted">${esc(new Date(n.date).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}))}</span><div class="player-note-actions">${btn('Изменить','edit-note','ghost small',`data-id="${esc(n.id)}"`)}${btn('×','delete-note','ghost small',`data-id="${esc(n.id)}" aria-label="Удалить заметку"`)}</div></div><h2 class="card-title">${esc(n.title)||'Заметка'}</h2><p class="prewrap">${esc(n.text)}</p></article>`).join('')||'<div class="empty-state"><h3>Чистая страница.</h3><p>Первая запись появится здесь после сохранения.</p></div>'}</div>`;}
function help(){return head('ПАМЯТКА УЧАСТНИКА','Всегда под рукой.','Личные инструменты и сохранения для твоей игры.')+`<div class="player-help-grid"><section class="panel"><h2 class="card-title">Проверки</h2><p>Характеристика: <strong>1d20 + (SPECIAL − 5)</strong>.<br>Навык: <strong>1d20 + значение навыка</strong>.</p><p>Навык и характеристика одновременно не складываются. Итог сравнивается с порогом, который задаёт ведущий. Особенности и снаряжение учитывайте по правилам вашей группы.</p><p class="muted">Кубики показывают результат броска. Условия успеха определяются за столом.</p></section><section class="panel"><h2 class="card-title">Цвет и экран</h2><p>В верхней панели доступны 10 оттенков терминала. Кнопка «ЭЛТ» включает и отключает декоративные полосы экрана.</p><p>Настройки сохраняются для этого браузера.</p></section><section class="panel"><h2 class="card-title">Личные сохранения</h2><p>Персонаж и заметки хранятся на этом устройстве. Они не синхронизируются с другими участниками. История кубиков ведётся отдельно.</p><p>Очистка данных браузера удаляет локальные записи. Скачай резервную копию перед переносом на другое устройство.</p><div class="player-data-actions">${btn('↓ Скачать мои данные','backup','primary')}${btn('↥ Восстановить копию','restore','ghost')}</div></section><section class="panel"><h2 class="card-title">Без интернета</h2><p>Скачай терминал одним HTML-файлом. Для переноса персонажа и заметок также сохрани и восстанови резервную копию.</p></section></div>`;}
function render(){if(!pages.some(([id])=>id===view))view='home';$('#nav').innerHTML=pages.map(([id,name])=>`<a class="nav-item ${id===view?'active':''}" href="#${id}" ${id===view?'aria-current="page"':''}>${icon(id)}<span>${name}</span></a>`).join('');const name=pages.find(([id])=>id===view)[1];$('#crumb').textContent=name;document.title=name+' · Нити — игрок';$('#workspace').innerHTML=({home,character,notes,dice:dicePage,help}[view])();$('#saveStatus').textContent=storageOK?'● Личные записи в браузере':'! Не сохранено · скачай копию';}
function navigate(id){if(location.hash.slice(1)===id){view=id;render();}else location.hash=id;}
window.addEventListener('hashchange',()=>{view=location.hash.slice(1);render();window.scrollTo(0,0);});
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function backup(){download('niti-player-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(player,null,2));}
function modal(title,body,submit){lastFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="modal-header"><h2 id="dialogTitle">${title}</h2>${btn('×','close-modal','ghost','aria-label="Закрыть"')}</div><form id="dialogForm"><div class="modal-body">${body}</div><div class="modal-footer">${btn('Отмена','close-modal','ghost')}<button class="button primary" type="submit">Сохранить</button></div></form></section></div>`;document.body.style.overflow='hidden';$('#dialogForm').onsubmit=e=>{e.preventDefault();submit(new FormData(e.currentTarget));};$('#modalRoot button').focus();}
function closeModal(){$('#modalRoot').innerHTML='';document.body.style.overflow='';lastFocus?.focus();}
document.addEventListener('click',event=>{const b=event.target.closest('[data-player-action]');if(!b)return;const action=b.dataset.playerAction,id=b.dataset.id;if(action==='backup')backup();if(action==='restore')$('#playerBackupFile').click();if(action==='close-modal')closeModal();if(action==='edit-note'){const n=player.notes.find(n=>n.id===id);if(!n)return;modal('Изменить заметку',inputField('editTitle','ЗАГОЛОВОК',n.title)+inputField('editText','ЗАПИСЬ',n.text,'textarea'),f=>{const text=String(f.get('editText')||'').trim();if(!text){toast('Добавь текст заметки.');return;}n.title=String(f.get('editTitle')||'').trim().slice(0,200);n.text=text;save();closeModal();render();});}if(action==='delete-note')modal('Удалить заметку?','<p>Эта запись будет удалена из личного архива.</p>',()=>{player.notes=player.notes.filter(n=>n.id!==id);save();closeModal();render();});});
document.addEventListener('submit',event=>{if(event.target.id==='profileForm'){event.preventDefault();const f=new FormData(event.target),profile={...player.profile,special:{}};for(const name of ['name','concept','hp','defence','inventory','description'])profile[name]=String(f.get(name)||'').trim();for(const[k]of SPECIAL){const n=Number(f.get('special-'+k));if(!Number.isInteger(n)||n<1||n>10){toast('Характеристики должны быть целыми числами от 1 до 10.');return;}profile.special[k]=n;}player.profile=profile;const success=save();$('#profileStatus').textContent=success?'Персонаж сохранён.':'Не удалось сохранить. Скачай копию данных.';}if(event.target.id==='noteForm'){event.preventDefault();const f=new FormData(event.target),text=String(f.get('noteText')||'').trim();if(!text){toast('Добавь текст заметки.');return;}if(player.notes.length>=1000){toast('Архив заполнен. Скачай копию и удали ненужные записи.');return;}player.notes.unshift({id:uid(),title:String(f.get('noteTitle')||'').trim().slice(0,200),text,date:new Date().toISOString()});save();render();toast('Заметка добавлена.');}});
document.addEventListener('input',event=>{if(!event.target.id.startsWith('special-'))return;const key=event.target.id.slice(8),n=Number(event.target.value),label=document.querySelector('[data-special-mod="'+key+'"]');if(label)label.textContent=Number.isInteger(n)&&n>=1&&n<=10?'Модификатор '+modifier(n):'От 1 до 10';});
$('#playerBackupFile').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error();const data=JSON.parse(await file.text());if(!validPlayer(data))throw Error();modal('Восстановить личный архив?','<p>Персонаж и заметки будут заменены данными из выбранной копии. Текущий архив можно скачать перед восстановлением.</p>',()=>{backup();player={kind:'niti-player',version:1,profile:{...data.profile,special:{...data.profile.special}},notes:data.notes.map(n=>({id:n.id,title:n.title,text:n.text,date:n.date}))};save();closeModal();render();toast('Личный архив восстановлен.');});}catch{toast('Нужна резервная копия терминала игрока в формате JSON.');}event.target.value='';});
document.addEventListener('keydown',event=>{if(!$('#modalRoot').children.length)return;if(event.key==='Escape')closeModal();if(event.key==='Tab'){const buttons=[...$('#modalRoot').querySelectorAll('button,input,textarea,select')],first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
render();
</script>
</body></html>
