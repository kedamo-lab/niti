function render(){if(!sections.some(s=>s[0]===view))view='overview';$('#nav').innerHTML=sections.map(([id,label])=>`<a href="#${id}" class="nav-item ${id===view?'active':''}" ${id===view?'aria-current="page"':''}>${icon(id)}<span>${label}</span>${id==='secrets'?'<span class="nav-count">'+state.secrets.filter(s=>!s.revealed).length+'</span>':''}</a>`).join('');$('#crumb').textContent=sections.find(s=>s[0]===view)[1];document.title=`${sections.find(s=>s[0]===view)[1]} · Нити`;$('#workspace').innerHTML=({overview,scenes,characters,threads,secrets,journal,manuscript}[view])();$('#saveStatus').textContent=storageOK?'● Сохранено в браузере':'! Не сохранено · скачай копию';}
function head(eyebrow,title,subtitle,actions=''){return `<div class="heading-row"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="subtitle">${subtitle}</p></div><div class="header-actions">${actions}</div></div>`;}
function sceneArt(){return `<div class="scene-art" aria-hidden="true"><svg viewBox="0 0 700 260" preserveAspectRatio="xMidYMid slice"><defs><pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".5" fill="#e5dec5" opacity=".12"/></pattern></defs><rect width="700" height="260" fill="#283b32"/><circle cx="494" cy="70" r="34" fill="#d1cdb1"/><circle cx="504" cy="58" r="33" fill="#283b32"/><path d="M0 148 80 110 160 145 250 78 360 145 455 120 560 150 650 96 700 135V260H0Z" fill="#425448"/><path d="M0 190 125 161 250 188 390 145 520 175 700 135V260H0Z" fill="#1c3028"/><path d="M330 260 364 203 379 190 394 170 402 160 406 166 400 195 380 230 367 260Z" fill="#a7ad95" opacity=".5"/><g fill="#14271f"><path d="m68 17-43 139h30l-35 66h110l-34-66h27Zm571-30-47 160h32l-40 92h118l-38-92h29Z"/><path d="m173 75-36 113h25l-27 50h85l-29-50h22Zm352 48-26 75h19l-23 48h70l-25-48h18Z"/></g><g stroke="#b4baa2" stroke-width="1" opacity=".3"><path d="M0 240h200m-132-7h80m300 4h153m-75 10h173"/></g><rect width="700" height="260" fill="url(#grain)"/></svg><span class="scene-art-content">МЕЖДУ СТРОК · ${esc(state.title)}</span></div>`;}
function clock(c){return `<div class="clock-card"><button class="clock" style="--progress:${c.value/c.max*360}deg" data-action="clock-plus" data-id="${esc(c.id)}" aria-label="Продвинуть угрозу ${esc(c.title)}: ${c.value} из ${c.max}"><span class="clock-inner">${c.value}<small>/${c.max}</small></span></button><div class="clock-copy"><div class="clock-title">${esc(c.title)}</div><div class="clock-label">${c.value===c.max?'Порог достигнут':c.value===0?'Пока тихо':c.max-c.value+' до последствия'}</div><div class="clock-controls"><button data-action="clock-minus" data-id="${esc(c.id)}" aria-label="Уменьшить угрозу">−</button><button data-action="clock-plus" data-id="${esc(c.id)}" aria-label="Продвинуть угрозу">+</button>${editBtn('clocks',c.id)}</div></div></div>`;}
function overview(){const s=state.scenes.find(s=>s.id===state.current)||state.scenes.find(s=>s.status!=='done');return head('ТВОЯ ИСТОРИЯ ПРОДОЛЖАЕТСЯ','Держи все нити в руках.','Чуть меньше искать в заметках. Чуть больше — быть внутри истории.',`<span class="session-pill"><span class="live-dot"></span> Сессия ${state.session.toString().padStart(2,'0')}</span>${btn('Завершить сессию ↗','end-session','ghost')}`)+`<div class="campaign-bar"><span>${state.demo?'<span class="demo-tag">ПРИМЕР</span>':'<span class="demo-tag">ТВОЙ СЮЖЕТ</span>'} ${esc(state.title)}</span><button class="text-button" data-action="campaign">Настроить историю ↗</button></div>${state.nextStart?`<div class="banner"><strong>Начать следующую сессию:</strong> ${esc(state.nextStart)}</div>`:''}<div class="stats-strip">${[[state.scenes.filter(s=>s.status!=='done').length,'сцен впереди','scenes'],[state.characters.length,'персонажей в истории','characters'],[state.threads.filter(t=>t.status==='open').length,'открытых нитей','threads'],[state.secrets.filter(s=>!s.revealed).length,'нераскрытых тайн','secrets']].map(([n,t,v])=>`<a href="#${v}" class="stat"><span class="stat-number">${String(n).padStart(2,'0')}</span><span class="stat-label">${t}</span><span class="stat-arrow">↗</span></a>`).join('')}</div><div class="dashboard-grid"><section class="panel scene-panel"><div class="panel-header"><h2 class="panel-title"><span class="tiny-icon">◈</span> Текущая сцена</h2><a class="text-button" href="#scenes">Все сцены ↗</a></div>${s?`${sceneArt()}<div class="scene-feature"><div class="scene-meta"><span class="eyebrow">СЦЕНА ${String(state.scenes.indexOf(s)+1).padStart(2,'0')}</span><span>⌖ ${esc(s.place)}</span></div><h3 class="scene-name">${esc(s.title)}</h3><p class="scene-hook">${esc(s.hook)}</p><div class="scene-actions">${btn('Открыть сцену ↗','open-scene','primary',`data-id="${esc(s.id)}"`)}${btn('Режим сцены ⛶','focus','ghost',`data-id="${esc(s.id)}"`)}</div><div class="scene-progress">${state.scenes.map((x,i)=>`<button class="progress-dot ${x.status==='done'?'done':x.id===s.id?'current':''}" data-action="open-scene" data-id="${esc(x.id)}" aria-label="Сцена ${i+1}: ${esc(x.title)}"></button>`).join('')}<span>${state.scenes.filter(x=>x.status==='done').length} из ${state.scenes.length} завершено</span></div></div>`:`<div class="empty-state">${icon('scenes')}<h3>Следующая сцена — твоя.</h3><p>Подготовь место, цель и первую фразу.</p>${btn('＋ Добавить сцену','add','primary','data-kind="scenes"')}</div>`}</section><section class="panel threats-panel"><div class="panel-header"><h2 class="panel-title"><span class="tiny-icon">◷</span> Мир не ждёт</h2><button class="text-button" data-action="add" data-kind="clocks" aria-label="Добавить угрозу">＋</button></div><p class="panel-intro">За кадром тоже что-то происходит.<br>Продвигай угрозы, когда мир делает ход.</p><div class="clocks-grid">${state.clocks.length?state.clocks.map(clock).join(''):'<div class="empty-state">Добавь угрозу и её последствие.</div>'}</div><div class="threat-foot">Нажми на круг, чтобы продвинуть часы.</div></section><section class="panel"><div class="panel-header"><h2 class="panel-title">Открытые нити <span class="badge">${state.threads.filter(t=>t.status==='open').length}</span></h2><a class="text-button" href="#threads">Все нити ↗</a></div><div class="thread-list">${state.threads.filter(t=>t.status==='open').slice(0,3).map(t=>`<a href="#threads" class="thread-row"><span class="thread-dot"></span><div class="thread-copy"><div class="thread-title">${esc(t.title)}</div><div class="thread-sub">${esc(t.detail)}</div></div><span>↗</span></a>`).join('')||'<div class="empty-state">У каждой истории есть незакрытый вопрос.</div>'}</div></section><section class="panel oracle-panel"><div class="panel-header"><h2 class="panel-title"><span class="tiny-icon">✧</span> Если всё пошло не по плану</h2><span class="tag">ИМПРОВИЗАЦИЯ</span></div><div id="oracleBody">${oracleHTML()}</div></section><section class="panel quick-note-panel"><div class="panel-header"><h2 class="panel-title">На полях</h2><a class="text-button" href="#journal">Журнал ↗</a></div><form id="quickNote" class="note-form"><label class="sr-only" for="quickNoteText">Решение или заметка</label><textarea id="quickNoteText" class="textarea" name="text" rows="2" required maxlength="10000" placeholder="Герои решили… Мир ответит на это…"></textarea>${btn('Запомнить ↗','submit-note','primary small','type="submit"')}</form></section></div>`;}
function oracleHTML(){return oracle?`<div class="oracle-title">${esc(oracle.title)}</div><p class="oracle-copy">${esc(oracle.body)}</p><p class="oracle-question">${esc(oracle.question)}</p><div class="oracle-actions">${btn('Ещё вариант','oracle-again','ghost small')}${btn('Взять в заметки ↗','oracle-save','primary small')+btn(oracleKind==='worldMoves'?'Поворот ↗':'Ход мира ↗',oracleKind==='worldMoves'?'oracle':'world','ghost small')}</div>`:`<div class="oracle-title">История умеет удивлять.<br>Даже ведущего.</div><p class="oracle-copy">Вытащи идею для поворота или узнай, что изменилось за кадром.</p><div class="oracle-actions">${btn('✧ Вытянуть поворот','oracle','primary small')}${btn('Ход мира ↗','world','ghost small')}</div>`;}
function scenes(){let s=state.scenes.find(x=>x.id===selectedScene)||state.scenes.find(x=>x.id===state.current)||state.scenes[0];return head('ПУТЬ ИСТОРИИ','Сцены','Подготовь ситуацию. Оставь героям право изменить исход.',btn('＋ Новая сцена','add','primary','data-kind="scenes"'))+`<div class="split-layout"><div class="list-stack">${state.scenes.map((x,i)=>`<button class="scene-list-card ${s?.id===x.id?'active':''}" data-action="select-scene" data-id="${esc(x.id)}"><span class="scene-number">${String(i+1).padStart(2,'0')}</span><div><strong>${esc(x.title)}</strong><small>${esc(x.place)} · ${statusLabel(x.status)}</small></div><span>↗</span></button>`).join('')||empty('Пока чистая страница. Добавь первую сцену.','scenes')}</div>${s?`<section class="panel scene-detail"><div class="panel-header"><span class="tag">${statusLabel(s.status)}</span>${editBtn('scenes',s.id)}</div><h2 class="scene-name">${esc(s.title)}</h2><div class="muted">⌖ ${esc(s.place)}</div><div class="field"><div class="field-label">ПЕРВАЯ ФРАЗА</div><p class="scene-hook">${esc(s.hook)}</p></div><div class="field"><div class="field-label">ЧТО ЗДЕСЬ НА КОНУ</div><p>${esc(s.goal)}</p></div><div class="field"><div class="field-label">ТОЛЬКО ДЛЯ ВЕДУЩЕГО</div><p class="prewrap">${esc(s.notes)}</p></div><div class="scene-actions">${btn('⛶ Показать сцену','focus','ghost',`data-id="${esc(s.id)}"`)}${s.status==='done'?btn('Вернуть в подготовку','reopen-scene','ghost',`data-id="${esc(s.id)}"`):s.id===state.current?btn('Завершить сцену ✓','complete-scene','primary',`data-id="${esc(s.id)}"`):btn('Сделать текущей','activate-scene','primary',`data-id="${esc(s.id)}"`)}</div></section>`:''}</div>`;}
function empty(text,kind){return `<div class="empty-state"><p>${text}</p>${kind?btn('＋ Добавить','add','ghost',`data-kind="${kind}"`):''}</div>`;}
function characters(){const c=state.characters.find(x=>x.id===selectedChar)||state.characters[0];return head('У КАЖДОГО ЕСТЬ МОТИВ','Люди между строк.','Помни, чего они хотят. И о чём предпочитают молчать.',btn('＋ Персонаж','add','primary','data-kind="characters"'))+`<section class="panel"><div class="panel-header"><h2 class="panel-title">Карта связей</h2>${btn('＋ Связь','add-relation','ghost small')}</div><div class="graph-wrap">${graph()}</div><p class="graph-hint">Выбери имя на карте — откроются мотивы и связи.</p></section>${c?`<div class="split-layout character-details"><section class="panel entity-card"><div class="card-top"><span class="avatar">${esc(c.name.slice(0,1))}</span>${editBtn('characters',c.id)}</div><h2 class="card-title">${esc(c.name)}</h2><p class="muted">${esc(c.role)}</p><div class="field"><div class="field-label">ХОЧЕТ</div><p>${esc(c.want)}</p></div><details><summary>Тайна персонажа · только для ведущего</summary><p class="prewrap">${esc(c.secret)}</p></details></section><section class="panel"><div class="panel-header"><h2 class="panel-title">Его нити</h2></div><div class="relation-list">${state.relations.filter(r=>r.from===c.id||r.to===c.id).map(r=>`<div class="relation-row"><span>${esc(state.characters.find(x=>x.id===r.from)?.name)} <span class="muted">→ ${esc(r.label)} →</span> ${esc(state.characters.find(x=>x.id===r.to)?.name)}</span><button class="text-button" data-action="delete-relation" data-id="${esc(r.id)}" aria-label="Удалить связь">×</button></div>`).join('')||empty('Связи ещё не обозначены.')}</div></section></div>`:empty('Первый персонаж ждёт своего имени.','characters')}`;}
function graph(){const n=state.characters.length;if(!n)return empty('Добавь персонажей, чтобы увидеть связи.');const width=900,height=Math.max(300,Math.ceil(n/5)*180);const pts=state.characters.map((c,i)=>({...c,x:n<=6?450+Math.cos(-Math.PI/2+i/n*Math.PI*2)*Math.min(300,n*75):100+(i%5)*175,y:n<=6?height/2+Math.sin(-Math.PI/2+i/n*Math.PI*2)*100:70+Math.floor(i/5)*180}));return `<svg viewBox="0 0 ${width} ${height}" role="group" aria-label="Карта связей персонажей">${state.relations.map(r=>{const a=pts.find(p=>p.id===r.from),b=pts.find(p=>p.id===r.to);if(!a||!b)return'';return `<g><path d="M${a.x} ${a.y} L${b.x} ${b.y}" fill="none" stroke="#a9ae9d" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="${(a.x+b.x)/2-75}" y="${(a.y+b.y)/2-11}" width="150" height="22" rx="11" fill="#f4f2e9"/><text class="graph-label" x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2+4}" text-anchor="middle">${esc(r.label.slice(0,24))}</text></g>`;}).join('')}${pts.map(c=>`<g class="graph-node ${c.id===selectedChar?'selected':''}" role="button" tabindex="0" data-action="select-char" data-id="${esc(c.id)}" aria-label="Открыть персонажа ${esc(c.name)}"><circle cx="${c.x}" cy="${c.y}" r="25"/><text x="${c.x}" y="${c.y+6}" text-anchor="middle" class="graph-initial">${esc(c.name.slice(0,1))}</text><rect x="${c.x-85}" y="${c.y+33}" width="170" height="29" rx="4" fill="#f4f2e9"/><text x="${c.x}" y="${c.y+52}" text-anchor="middle" class="graph-name">${esc(c.name.slice(0,23))}</text></g>`).join('')}</svg>`;}
function threads(){return head('НИ ОДИН ВЫБОР НЕ ИСЧЕЗАЕТ','Сюжетные нити','Вопросы, обещания и последствия, которые ещё отзовутся.',btn('＋ Новая нить','add','primary','data-kind="threads"'))+`<div class="kanban">${[['open','В игре'],['later','На потом'],['closed','Закрыто']].map(([status,label])=>`<section class="kanban-column"><div class="kanban-title">${label}<span class="badge">${state.threads.filter(t=>t.status===status).length}</span></div>${state.threads.filter(t=>t.status===status).map(t=>`<article class="thread-card"><div class="card-top"><span class="thread-dot"></span>${editBtn('threads',t.id)}</div><h2 class="card-title">${esc(t.title)}</h2><p class="card-body">${esc(t.detail)}</p><label class="field-label" for="thread-${esc(t.id)}">СТАТУС</label><select class="input" id="thread-${esc(t.id)}" data-thread="${esc(t.id)}">${['open','later','closed'].map(v=>`<option value="${v}" ${v===status?'selected':''}>${statusLabel(v)}</option>`).join('')}</select></article>`).join('')||'<p class="muted kanban-empty">Здесь пока тихо.</p>'}</section>`).join('')}</div>`;}
function secrets(){return head('ПО ЭТУ СТОРОНУ ШИРМЫ','Правда под поверхностью.','Отделяй то, что знаешь ты, от того, что уже узнали герои.',btn('＋ Новая тайна','add','primary','data-kind="secrets"'))+`<div class="card-grid">${state.secrets.map(x=>`<article class="panel secret-card"><div class="card-top"><span class="tag">${x.revealed?'РАСКРЫТО':'ЗА ШИРМОЙ'}</span>${editBtn('secrets',x.id)}</div><h2 class="card-title">${esc(x.title)}</h2><div class="field"><div class="field-label">УЛИКА ДЛЯ ГЕРОЕВ</div><p>${esc(x.clue)}</p></div><details ${x.revealed?'open':''}><summary>${x.revealed?'Истина':'Показать истину ведущему'}</summary><p class="prewrap">${esc(x.truth)}</p></details><div class="card-footer">${btn(x.revealed?'Вернуть за ширму':'Герои узнали правду ✓','toggle-secret',x.revealed?'ghost small':'primary small',`data-id="${esc(x.id)}"`)}</div></article>`).join('')||empty('Что на самом деле происходит в твоей истории?','secrets')}</div>`;}
function journal(){return head('ПАМЯТЬ ИСТОРИИ','То, что уже случилось.','Решения героев и ответы мира. Всё, что стоит унести в следующую сессию.',btn('↓ Скачать журнал','journal-export','ghost'))+`<section class="panel"><div class="panel-header"><h2 class="panel-title">Новая запись</h2><span class="tag">СЕССИЯ ${state.session}</span></div><form class="note-form" id="journalForm"><label class="sr-only" for="journalText">Текст записи</label><textarea class="textarea" id="journalText" name="text" rows="3" required maxlength="20000" placeholder="Какое решение приняли герои? Что изменилось в мире?"></textarea><div class="scene-actions"><label class="sr-only" for="noteKind">Тип записи</label><select id="noteKind" class="input" name="kind"><option>Решение</option><option>Последствие</option><option>Заметка</option></select><button class="button primary" type="submit">Запомнить ↗</button></div></form></section><div class="journal-list">${state.journal.map(j=>`<article class="journal-item"><div class="journal-time">${esc(new Date(j.date).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}<span>Сессия ${j.session||1}</span></div><div class="journal-content"><span class="tag">${esc(j.kind)}</span><p class="prewrap">${esc(j.text)}</p></div><button class="text-button" data-action="delete-journal" data-id="${esc(j.id)}" aria-label="Удалить запись">×</button></article>`).join('')||empty('Пока ничего не записано. У истории хорошая память — если ей немного помочь.')}</div>`;}
function manuscript(){return head('С ЧЕГО ВСЁ НАЧАЛОСЬ','Твоя рукопись.','Держи исходный текст рядом с живой историей.',btn('↥ Открыть .txt / .md','story-file','ghost'))+`${state.demo?'<div class="banner"><strong>Сейчас открыт пример.</strong> Это вымышленная история для знакомства с пультом. Вставь свой сюжет ниже или начни чистую историю.</div>':''}<section class="panel manuscript"><form id="manuscriptForm"><label class="field-label" for="storyTitle">НАЗВАНИЕ ИСТОРИИ</label><input id="storyTitle" name="title" class="input" required maxlength="200" value="${esc(state.title)}"><label class="field-label" for="storyText">ИСХОДНЫЙ ТЕКСТ</label><textarea id="storyText" name="text" class="textarea manuscript-text" rows="18" maxlength="1000000" placeholder="Вставь текст сюжета сюда…">${esc(state.manuscript)}</textarea><label class="checkbox-label"><input type="checkbox" name="fromHeadings"> Добавить сцены из заголовков Markdown (# и ##)</label><p class="muted">Текст сохраняется как есть. Заголовки можно превратить в заготовки сцен, персонажей и тайны ты задаёшь сам.</p><div class="scene-actions"><button class="button primary" type="submit">Сохранить рукопись ↗</button>${btn('Начать чистую историю','new-story','ghost')}</div></form></section><section class="panel settings-panel"><div class="panel-header"><h2 class="panel-title">Твоя история остаётся у тебя.</h2></div><p>Изменения хранятся в этом браузере. Для переноса на другое устройство скачай резервную копию. Очистка данных браузера удалит локальные записи.</p><div class="scene-actions">${btn('↓ Скачать копию','backup','ghost')}${btn('↥ Восстановить из JSON','restore','ghost')}</div></section>`;}
function navigate(v){if(location.hash.slice(1)!==v)location.hash=v;else{view=v;render();}}
window.addEventListener('hashchange',()=>{view=location.hash.slice(1);render();window.scrollTo(0,0);});
function modal(title,body,onSubmit,footer='',large=false){lastFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="modal ${large?'large':''}"><div class="modal-header"><h2 id="modalTitle">${title}</h2><button class="close-button" data-action="close-modal" aria-label="Закрыть">×</button></div><form id="dialogForm"><div class="modal-body">${body}</div><div class="modal-footer">${footer||btn('Отмена','close-modal','ghost')+'<button class="button primary" type="submit">Сохранить ↗</button>'}</div></form></section></div>`;document.body.style.overflow='hidden';$('#dialogForm').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.currentTarget));};setTimeout(()=>$('#modalRoot').querySelector('input,textarea,select,button')?.focus(),30);}
function closeModal(){$('#modalRoot').innerHTML='';document.body.style.overflow='';lastFocus?.focus();}
function field(key,label,value='',type='input',required=false,options=[]){let control=type==='textarea'?`<textarea class="textarea" id="f-${key}" name="${key}" rows="3" maxlength="20000" ${required?'required':''}>${esc(value)}</textarea>`:type==='select'?`<select class="input" id="f-${key}" name="${key}">${options.map(([k,l])=>`<option value="${esc(k)}" ${k===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select>`:`<input class="input" id="f-${key}" name="${key}" value="${esc(value)}" maxlength="300" ${required?'required':''}>`;return `<div class="field"><label class="field-label" for="f-${key}">${label}</label>${control}</div>`;}
const schemas={scenes:{title:'Сцена',fields:[['title','Название','input',true],['place','Место'],['hook','Первая фраза · можно показать героям','textarea'],['goal','Что на кону','textarea'],['notes','Заметки только для ведущего','textarea']]},characters:{title:'Персонаж',fields:[['name','Имя','input',true],['role','Роль в истории'],['want','Чего хочет','textarea'],['secret','Что скрывает','textarea']]},threads:{title:'Сюжетная нить',fields:[['title','Открытый вопрос','input',true],['detail','Зацепки и возможные последствия','textarea']]},clocks:{title:'Угроза',fields:[['title','Что приближается','input',true],['consequence','Что случится, когда часы заполнятся','textarea',true],['max','Число шагов','select',true]]},secrets:{title:'Тайна',fields:[['title','Название','input',true],['clue','Улика для героев','textarea'],['truth','Скрытая истина','textarea',true]]}};
function editor(kind,id){const schema=schemas[kind];if(!schema)return;const old=state[kind].find(x=>x.id===id);const defaults={scenes:{place:'',goal:'',hook:'',notes:'',status:'ready'},characters:{role:'',want:'',secret:'',color:'moss'},threads:{detail:'',status:'open'},clocks:{max:6,value:0,consequence:''},secrets:{truth:'',clue:'',revealed:false}};const obj=old||{...defaults[kind]};modal(`${old?'Редактировать':'Добавить'} · ${schema.title}`,schema.fields.map(([k,l,t,r])=>field(k,l,obj[k]??'',t||'input',r,k==='max'?[2,3,4,6,8,10,12].map(x=>[String(x),String(x)]):[])).join(''),f=>{const data={...obj,id:old?.id||uid()};for(const[k]of schema.fields)data[k]=k==='max'?Number(f.get(k)):String(f.get(k)||'').trim();if(!data[schema.fields[0][0]]){toast('Название не может быть пустым.');return;}if(kind==='clocks')data.value=Math.min(data.value,data.max);if(old)state[kind]=state[kind].map(x=>x.id===id?data:x);else{state[kind].push(data);if(kind==='scenes'&&!state.current){state.current=data.id;data.status='active';}if(kind==='characters')selectedChar=data.id;}save();closeModal();render();toast('Сохранено.');},(old?btn('Удалить','delete-entity','danger',`data-kind="${kind}" data-id="${esc(id)}"`):'')+btn('Отмена','close-modal','ghost')+'<button class="button primary" type="submit">Сохранить ↗</button>');}
function confirmDialog(title,text,action,label='Подтвердить'){modal(title,`<p>${esc(text)}</p>`,()=>{action();closeModal();render();},btn('Отмена','close-modal','ghost')+`<button class="button primary" type="submit">${label}</button>`);}
function newStory(title='Новая история',text=''){state={version:1,title:title.trim()||'Новая история',demo:false,session:1,current:null,scenes:[],characters:[],relations:[],threads:[],clocks:[],secrets:[],journal:[],manuscript:text,nextStart:''};selectedScene=null;selectedChar=null;oracle=null;save();}
function download(name,text,type='application/json'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function sceneAction(id,mode){const s=state.scenes.find(x=>x.id===id);if(!s)return;if(mode==='complete'){s.status='done';record('Завершена сцена: '+s.title,'Сцена');const next=state.scenes.find(x=>x.status!=='done');state.current=next?.id||null;if(next)next.status='active';selectedScene=next?.id||s.id;}else if(mode==='reopen'){s.status='ready';if(!state.current){state.current=s.id;s.status='active';}}else{state.scenes.forEach(x=>{if(x.status==='active')x.status='ready';});s.status='active';state.current=s.id;record('Начата сцена: '+s.title,'Сцена');}save();render();}
function focusScene(id){const s=state.scenes.find(x=>x.id===id);if(!s)return;lastFocus=document.activeElement;$('#focusRoot').innerHTML=`<section class="focus-mode" role="dialog" aria-modal="true" aria-label="Режим сцены"><div class="focus-controls"><span>НИТИ · РЕЖИМ СЦЕНЫ</span><button class="button ghost" data-action="close-focus">Закрыть · Esc</button></div><div class="focus-content"><div class="focus-eyebrow">${esc(s.place)}</div><h1 class="focus-title">${esc(s.title)}</h1><p class="focus-text">${esc(s.hook)}</p><span class="focus-ornament">✧</span></div><div class="focus-foot">В этой сцене всё ещё возможно.</div></section>`;document.body.style.overflow='hidden';$('#focusRoot button').focus();}
function closeFocus(){$('#focusRoot').innerHTML='';document.body.style.overflow='';lastFocus?.focus();}
function advanceClock(id,delta){const c=state.clocks.find(x=>x.id===id);if(!c)return;const before=c.value;c.value=Math.max(0,Math.min(c.max,c.value+delta));if(c.value===before)return;if(c.value===c.max){record('Угроза достигла порога: '+c.title+'. '+c.consequence,'Угроза');save();render();modal('Часы заполнились.',`<div class="eyebrow">${esc(c.title)}</div><p class="scene-hook">${esc(c.consequence)}</p><p class="muted">Последствие записано в журнал. Реши, как оно проявится в истории.</p>`,()=>closeModal(),'<button class="button primary" type="submit">Вернуться за ширму</button>');}else{save();render();}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,kind=b.dataset.kind;const actions={manuscript:()=>navigate('manuscript'),add:()=>editor(kind),edit:()=>editor(kind,id),'close-modal':closeModal,'close-focus':closeFocus,'open-scene':()=>{selectedScene=id;navigate('scenes');},'select-scene':()=>{selectedScene=id;render();},'select-char':()=>{selectedChar=id;render();},focus:()=>focusScene(id),'activate-scene':()=>sceneAction(id,'active'),'complete-scene':()=>sceneAction(id,'complete'),'reopen-scene':()=>sceneAction(id,'reopen'),'clock-plus':()=>advanceClock(id,1),'clock-minus':()=>advanceClock(id,-1),oracle:()=>{oracleKind='complications';actions['oracle-again']();},'oracle-again':()=>{const list=STORY_PROMPTS[oracleKind];const pool=list.filter(x=>x.id!==oracle?.id);oracle=pool[Math.floor(Math.random()*pool.length)];$('#oracleBody').innerHTML=oracleHTML();},world:()=>{oracleKind='worldMoves';actions['oracle-again']();},'oracle-save':()=>{if(!oracle)return;record(oracle.title+'\n'+oracle.body+'\n'+oracle.question,'Идея, не факт');save();toast('Идея записана в журнал.');},'toggle-secret':()=>{const x=state.secrets.find(x=>x.id===id);x.revealed=!x.revealed;record((x.revealed?'Герои узнали тайну: ':'Тайна возвращена за ширму: ')+x.title,'Тайна');save();render();},backup:()=>{download('niti-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2));toast('Копия скачана. Храни её вместе с рукописью.');},restore:()=>$('#backupFile').click(),'story-file':()=>$('#storyFile').click(),'journal-export':()=>download('niti-session-journal.md',`# ${state.title}\n\n`+state.journal.slice().reverse().map(j=>`## ${j.kind} · сессия ${j.session||1}\n${new Date(j.date).toLocaleString('ru-RU')}\n\n${j.text}\n`).join('\n'),'text/markdown'),'new-story':()=>confirmDialog('Начать новую историю?','Текущая история в этом браузере будет заменена. Сначала скачай резервную копию, если хочешь её сохранить.',()=>{newStory();},'Начать с чистого листа'),'delete-entity':()=>confirmDialog('Удалить запись?','Запись будет удалена. Для персонажа также удалятся его связи.',()=>{state[kind]=state[kind].filter(x=>x.id!==id);if(kind==='characters')state.relations=state.relations.filter(x=>x.from!==id&&x.to!==id);if(kind==='scenes'&&state.current===id){state.current=state.scenes.find(x=>x.status!=='done')?.id||null;if(state.current)state.scenes.find(x=>x.id===state.current).status='active';}save();},'Удалить'),'delete-relation':()=>confirmDialog('Удалить связь?','Персонажи останутся в истории.',()=>{state.relations=state.relations.filter(r=>r.id!==id);save();},'Удалить'),'delete-journal':()=>confirmDialog('Удалить запись из журнала?','Это действие уберёт только выбранную запись.',()=>{state.journal=state.journal.filter(x=>x.id!==id);save();},'Удалить'),'add-relation':()=>{if(state.characters.length<2){toast('Для связи нужны хотя бы два персонажа.');return;}const opts=state.characters.map(c=>[c.id,c.name]);modal('Новая связь',field('from','От кого',opts[0][0],'select',true,opts)+field('to','К кому',opts[1][0],'select',true,opts)+field('label','Что их связывает','','input',true),f=>{if(f.get('from')===f.get('to')){toast('Выбери двух разных персонажей.');return;}const label=String(f.get('label')).trim();if(!label){toast('Опиши связь.');return;}state.relations.push({id:uid(),from:f.get('from'),to:f.get('to'),label});save();closeModal();render();});},campaign:()=>modal('Название истории',field('title','Название',state.title,'input',true),f=>{const title=String(f.get('title')).trim();if(!title){toast('Введи название.');return;}state.title=title;save();closeModal();render();}),'end-session':()=>modal('Оставь след для себя будущего.',field('changed','Что изменилось','', 'textarea',true)+field('open','Что осталось открытым','','textarea')+field('next','С чего начнём в следующий раз',state.nextStart,'textarea',true),f=>{const changed=String(f.get('changed')).trim(),next=String(f.get('next')).trim();if(!changed||!next){toast('Запиши итог и начало следующей сессии.');return;}record('Что изменилось:\n'+changed+'\n\nОсталось открытым:\n'+String(f.get('open')).trim()+'\n\nВ следующий раз:\n'+next,'Итоги сессии');state.nextStart=next;state.session++;save();closeModal();render();toast('Сессия завершена. Продолжение уже ждёт.');}),help:()=>modal('Добро пожаловать за ширму.',`<p><strong>1. Принеси свою историю.</strong> В «Рукописи» вставь текст или открой .txt / .md. Сейчас загружен самостоятельный пример.</p><p><strong>2. Подготовь опоры.</strong> Добавь сцены, мотивы персонажей, тайны и часы угроз. Всё можно менять.</p><p><strong>3. Веди свободно.</strong> Открывай сцену без секретов, записывай решения и двигай часы, когда это логично для мира.</p><p><strong>4. Сохрани продолжение.</strong> Заверши сессию и скачай резервную копию. Данные хранятся только в этом браузере, без синхронизации между устройствами.</p><p class="muted">Повороты — готовая колода подсказок, а не автоматический анализ рукописи.</p>`,()=>closeModal(),'<button class="button primary" type="submit">Я за ширмой ↗</button>')};actions[a]?.();});
document.addEventListener('submit',e=>{if(e.target.id==='quickNote'||e.target.id==='journalForm'){e.preventDefault();const f=new FormData(e.target),text=String(f.get('text')).trim();if(!text){toast('Сначала запиши мысль.');return;}record(text,f.get('kind')||'Заметка');save();e.target.reset();toast('История запомнила.');if(view==='journal')render();}if(e.target.id==='manuscriptForm'){e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')).trim();if(!title){toast('У истории должно быть название.');return;}const text=String(f.get('text')||'');const apply=()=>{state.title=title;state.manuscript=text;state.demo=false;let count=0;if(f.has('fromHeadings')){const parts=text.split(/^(#{1,2})\s+(.+)$/gm);for(let i=1;i<parts.length;i+=3){const title=parts[i+1].trim(),notes=(parts[i+2]||'').trim();state.scenes.push({id:uid(),title,place:'',goal:'',hook:notes.split(/\n\s*\n/)[0]?.slice(0,1500)||'',notes,status:'ready'});count++;}if(!state.current&&state.scenes.length){state.current=state.scenes[0].id;state.scenes[0].status='active';}}save();render();toast('Рукопись сохранена.'+(count?' Добавлено сцен: '+count+'.':''));};if(state.demo){confirmDialog('Заменить пример своим сюжетом?','Демонстрационные сцены, персонажи, тайны и журнал будут очищены. Текст из формы станет рукописью новой истории.',()=>{newStory(title,text);apply();},'Загрузить мою историю');}else apply();}});
document.addEventListener('change',e=>{if(e.target.dataset.thread){const t=state.threads.find(x=>x.id===e.target.dataset.thread);if(!t)return;t.status=e.target.value;record('Нить «'+t.title+'»: '+statusLabel(t.status),'Нить');save();render();}});
$('#storyFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2000000){toast('Файл слишком большой. Выбери текст до 2 МБ.');return;}try{const text=await f.text();navigate('manuscript');setTimeout(()=>{$('#storyText').value=text;$('#storyTitle').value=f.name.replace(/\.(txt|md)$/i,'');toast('Текст открыт. Нажми «Сохранить рукопись».');},30);}catch{toast('Не удалось прочитать файл.');}e.target.value='';});
$('#backupFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(!validState(data))throw Error();confirmDialog('Восстановить историю?',`«${data.title}» заменит текущую историю в этом браузере.`,()=>{state=data;selectedScene=state.current;selectedChar=state.characters[0]?.id;oracle=null;save();toast('История восстановлена.');},'Восстановить');}catch{toast('Не удалось открыть копию. Нужен JSON, скачанный из «Нитей».');}e.target.value='';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#focusRoot').children.length)closeFocus();else if($('#modalRoot').children.length)closeModal();}if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('graph-node')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}const root=$('#focusRoot').children.length?$('#focusRoot'):$('#modalRoot').children.length?$('#modalRoot'):null;if(e.key==='Tab'&&root){const els=[...root.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);if(els.length){const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
render();symbols();if(storageOK)save();
