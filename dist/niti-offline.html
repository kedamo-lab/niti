  "manuscript": "ТАРТАР\nЗадания и проверки для ведущего\n\nОт дня рождения до выхода из Чистилища. Пороги, опыт, боевые профили и короткие реплики ниже — настольная настройка. «Доп.» обозначает дополнительный способ решения.\n\nХарактеристика: 1d20 + (SPECIAL − 5). Например, S 7 даёт +2. Навык: 1d20 + значение навыка из листа. Навык и SPECIAL одновременно не складываются. Бонусы особенностей и снаряжения действуют по твоим правилам.\n\nИтог ≥ порога — успех; ниже — указанная ветка провала. Одну и ту же попытку не перебрасывают без нового основания. Опыт получает каждый участник один раз; опыт за бой уже входит в награду задания. Для вступления в бой отдельный бросок не нужен; атаки и урон — по обычным правилам.\n\nОбозначения: S — Сила; P — Восприятие; E — Выносливость; C — Харизма; I — Интеллект; A — Ловкость; L — Удача. Бой при необходимости — по профилям в конце.\n\nДЕТСТВО\n\n1 Найти отцовский ключ\n\nКто / где: отец, семейная комната. Запуск: «Найди мой маленький газовый ключ с деревянной ручкой».\n\nПредмет: один ключ со звёздочкой. Нижний ящик возле кровати Брука в комнате Кэтти. Принести отцу.\n\nВариант: Помочь отцу вспомнить\nБросок и порог: 1d20 + (I − 5) ≥ 13\nУспех: Вспоминает, что отдал ключ Бруку. Задание закрыто без доставки; кастета нет\nПровал: Не вспоминает. Открыта цепочка расспросов или поиск\n\nВариант: Расспросить семью\nБросок и порог: Без броска\nУспех: Мать → Кирк → Кэтти → Брук. Брук разрешает взять ключ\nПровал: —\n\nВариант: Найти самостоятельно\nБросок и порог: 1d20 + (P − 5) ≥ 12\nУспех: Находит нужный ящик и ключ\nПровал: Не находит. Можно расспросить семью\n\nВариант: Взять тайком\nБросок и порог: 1d20 + Кража ≥ 14\nУспех: Забирает ключ незаметно\nПровал: Брук замечает. После объяснения позволяет вернуть чужой инструмент\n\nЗавершение / опыт: ключ доставлен либо отец вспомнил владельца — 50 XP. За физический возврат отец даёт один алюминиевый кастет. Второй способ не даёт повторного опыта.\n\n2 Защитить Кирка от Булли\n\nКто / где: Кирк, жилой сектор; Булли — в юго-восточной части сектора. Запуск: «Булли снова меня задирает. Помоги сделать так, чтобы он отстал».\n\nВариант: Договориться\nБросок и порог: 1d20 + Красноречие ≥ 12\nУспех: Булли обещает оставить Кирка в покое. Квест выполнен\nПровал: Булли предлагает драку. Принять — начать бой; отказаться — уйти, квест не выполнен\n\nВариант: Запугать силой вместо переговоров\nБросок и порог: 1d20 + (S − 5) ≥ 14\nУспех: Булли отступает; квест выполнен\nПровал: Он не верит угрозе и вызывает на драку\n\nВариант: Сразу подраться\nБросок и порог: Без проверки на начало\nУспех: Снизить Булли с 24 до 6 ОЖ или ниже. Он сдаётся, квест выполнен\nПровал: Если герой сдаётся или выбывает раньше, Булли не отстал; можно позже привести взрослого\n\nВариант: Драться вместе с Кирком\nБросок и порог: Без проверки на начало\nУспех: Та же цель: Булли ≤ 6 ОЖ. Кирк участвует по профилю ниже\nПровал: При поражении — обратиться к взрослому; не выдавать награду за незавершённую цель\n\nВариант: Доп. Попросить защиты у родителей\nБросок и порог: Без броска после честного рассказа\nУспех: Взрослые прекращают травлю. Квест выполнен\nПровал: —\n\nБой: Булли 24 ОЖ, КБ 6, ОД 8. Обычные броски атак; отдельного броска «победить» нет. При 6 ОЖ сдаётся, добивать не требуется. Кирк-помощник: 21 ОЖ, КБ 5, ОД 7, P 4; кулак 1d20+0, урон 1d3, 2 ОД.\n\nЗавершение / опыт: сообщить Кирку о прекращении травли — 40 XP за любой завершённый способ. Убийство Булли не даёт дополнительного опыта и вызывает разбирательство. Неудачную попытку уговорить нельзя сразу заменить новым броском тех же переговоров.\n\n3 Достать Рад Аут для Стеллы\n\nКто / где: Кэтти, комната её семьи. Запуск: «Маме нужен “Рад-Аут”. Попробуй попросить его у доктора».\n\nПредмет: одна доза «Рад-Аута» у Пата в центре жилого сектора. Передать Кэтти для Стеллы либо самому доктору для её лечения. В этой версии это обычный антирадин твоей системы.\n\nВариант: Убедить Пата выдать бесплатно\nБросок и порог: 1d20 + Красноречие ≥ 13\nУспех: Выдаёт одну дозу\nПровал: Требует оплату либо взрослого поручителя\n\nВариант: Доп. Попросить в долг на семью\nБросок и порог: 1d20 + (C − 5) ≥ 14\nУспех: Выдаёт дозу, семья должна 20 батареек\nПровал: В долг не даёт. Покупка или поручительство\n\nВариант: Купить\nБросок и порог: Без броска, 20 батареек\nУспех: Одна доза получена\nПровал: Без денег покупка недоступна\n\nВариант: Украсть из открытого лотка\nБросок и порог: 1d20 + Кража ≥ 14\nУспех: Одна доза получена тайком\nПровал: Пат замечает и убирает лекарства. Дальше — покупка или взрослый поручитель\n\nВариант: Доп. Привести Стеллу с Бруком\nБросок и порог: Без броска\nУспех: Пат подтверждает состояние и сам проводит лечение\nПровал: —\n\nВариант: Узнать дополнительную информацию\nБросок и порог: 1d20 + Первая помощь ≥ 12\nУспех: Пат объясняет, что облучение связано с работой, а не обычной простудой\nПровал: Только назначение препарата; основная цель остаётся доступна\n\nДополнительно: подарить Кэтти одну конфету — без броска; она запоминает помощь. Конфета не заменяет лекарство.\n\nЗавершение / опыт: препарат действительно передан для лечения — 50 XP. За запасные украденные дозы опыта нет.\n\nРАБОЧИЕ ЗАДАНИЯ\n\n4 Принести ядерный напиток Сыну Богов\n\nКто / где: охранник перехода на фермы. Запуск: «Вот одиннадцать конфет. Принеси бутылку ядерного напитка».\n\nЦепочка: пустая бутылка → аппарат в подсобке техуровня → готовый напиток → охранник. Бутылки: одна в багажнике красной машины на парковке, вторая у Смитти за улучшение аппарата.\n\nВариант / этап: Найти бутылку на парковке\nБросок и порог: 1d20 + (P − 5) ≥ 10\nУспех: Бутылка из красной машины получена\nПровал: Не находит; получить бутылку у Смитти или попросить точную наводку\n\nВариант / этап: Найти бутылку по точной наводке\nБросок и порог: Без броска\nУспех: Забирает из указанного багажника\nПровал: —\n\nВариант / этап: Улучшить аппарат для Смитти\nБросок и порог: 1d20 + Ремонт ≥ 10, с деталями ниже\nУспех: Смитти даёт бутылку. Теперь 5 конфет = 1 бутылка напитка\nПровал: Улучшение не работает. Можно пользоваться обычным аппаратом: 10 конфет = 1 бутылка; тара — из машины\n\nВариант / этап: Обойти крысу в подсобке\nБросок и порог: 1d20 + Скрытность ≥ 10\nУспех: Герой получает доступ к аппарату\nПровал: Крыса замечает: начинается бой\n\nВариант / этап: Отвлечь крысу\nБросок и порог: Без броска, 1 конфета\nУспех: Доступ к аппарату; остаётся 10 конфет\nПровал: Без приманки выбрать скрытность или бой\n\nВариант / этап: Убить или прогнать крысу\nБросок и порог: Без проверки на начало боя\nУспех: Крыса убита либо снижена до 3 ОЖ и убежала\nПровал: Можно отступить и сменить способ\n\nВариант / этап: Доп. Отменить побор через наряд\nБросок и порог: 1d20 + Красноречие ≥ 16\nУспех: Охранник пропускает без напитка; вернуть оставшиеся конфеты\nПровал: Охранник требует выполнить поручение\n\nДетали улучшения в этой версии: корпус — Смитти; порция угля — остывший зольный ящик мастерской; лоскут — Кэрол; проволока — ящик негодных обмоток. По разрешению хозяев выдаются без бросков, по одному комплекту. Это угольный картридж, не фильтр из задания 7.\n\nВыход: без улучшения из 10 конфет получится одна бутылка; с улучшением из 10 — две, если есть две пустые бутылки. Вторая остаётся героям. Одна бутылка передаётся охраннику без броска.\n\nОпыт: напиток передан либо побор отменён — 30 XP. Бой с крысой включён. Простое игнорирование поручения награды не даёт; охранник продолжает требовать напиток при проходе.\n\n5 Починить трансформатор\n\nКто / где: Грегориус; трансформатор на техуровне. Запуск: «Восстанови трансформатор. Он должен работать до конца смены».\n\nНужно: газовый ключ отца или инструмент Смитти; изоляционный вкладыш у Кэрол; схема под крышкой трансформатора. Детали под официальный наряд дают без броска.\n\nВариант / этап: Разобраться в схеме\nБросок и порог: 1d20 + (I − 5) ≥ 12\nУспех: Порог самостоятельного ремонта снижается с 15 до 12\nПровал: Самостоятельный ремонт остаётся сложностью 15\n\nВариант / этап: Самостоятельный ремонт\nБросок и порог: 1d20 + Ремонт ≥ 15; со схемой ≥ 12\nУспех: Трансформатор исправен\nПровал: Не работает. Можно попросить Кэрол или Смитти; повтор без новой помощи недоступен\n\nВариант / этап: Поймать Кэрол на профессиональном вызове\nБросок и порог: 1d20 + (C − 5) ≥ 14\nУспех: Кэрол чинит сама\nПровал: Отказывается. Можно уважительно попросить работать вместе\n\nВариант / этап: Доп. Работать вместе с Кэрол\nБросок и порог: Без броска, 45 минут подсобной работы\nУспех: Кэрол ведёт ремонт; узел исправен\nПровал: —\n\nВариант / этап: Уговорить Смитти\nБросок и порог: 1d20 + Красноречие ≥ 13\nУспех: Смитти чинит\nПровал: Требует одну бутылку напитка; без неё остаются другие способы\n\nВариант / этап: Заплатить Смитти напитком\nБросок и порог: Без броска, 1 бутылка\nУспех: Чинит; напиток расходуется\nПровал: —\n\nОпасная ошибка: сначала отключить подписанный рычаг — без броска. Если герой полез под напряжением и провалил ремонт: 1d20 + (E − 5) ≥ 12 — получает 1d3 урона; ниже 12 — 1d6. Затем питание отключается, открыты обычные пути ремонта.\n\nЗавершение / опыт: получить отметку мастера и доложить Грегориусу — 60 XP. Исправный узел упрощает закрытие заслонки при побеге, задание 13.\n\n6 Выяснить причину болезни лавашей\n\nКто / где: Грегориус; смотрители и животные на фермах. Запуск: «Узнай, отчего болеют лаваши. Мне нужна причина».\n\nВариант: Осмотреть поилки\nБросок и порог: 1d20 + (P − 5) ≥ 11\nУспех: Замечает загрязнение воды; открыта проверка очистителя\nПровал: Не замечает. Открыты осмотр животных и расспросы\n\nВариант: Осмотреть лаваша\nБросок и порог: 1d20 + Первая помощь ≥ 12\nУспех: Понимает, что причина связана с тем, что животные пьют; нужно проверить воду\nПровал: Диагноз неясен; можно спросить смотрителя\n\nВариант: Сравнить пробы воды\nБросок и порог: 1d20 + (I − 5) ≥ 13\nУспех: Доказывает связь болезни со сломанным очистителем\nПровал: Не может доказать; смотритель покажет, из какого узла берут воду\n\nВариант: Получить показания смотрителя\nБросок и порог: 1d20 + Красноречие ≥ 10\nУспех: Называет неисправный узел и ответственного Брука\nПровал: Боится обвинять человека, но показывает сам неработающий агрегат\n\nВариант: Проверить указанный агрегат\nБросок и порог: Без броска\nУспех: Неисправность подтверждена; открывается задание 7\nПровал: —\n\nЗавершение / опыт: установить причину и сообщить смотрителям / Грегориусу — 40 XP. Причина: вода проходит через неисправный очиститель. Установить причину и починить узел — две разные цели.\n\n7 Починить водоочиститель\n\nКто / где: Грегориус после доклада о неисправности; Смитти на техуровне. Запуск Смитти: «Нужны фильтр, кронштейн и клапан. Соберёшь — восстановим подачу».\n\nПредмет: Мембранный фильтр, 1\nГде взять: Смитти\nПолучение / бросок: Показать наряд — без броска\nЕсли не получилось: Получить наряд у Грегориуса, а не красть фильтр\n\nПредмет: Кронштейн, 1\nГде взять: Ребёнок в жилом секторе\nПолучение / бросок: Ответить на загадку: 1d20 + (I − 5) ≥ 14; если слушал сказку матери — ≥ 11\nЕсли не получилось: Обмен, уговор или силовой подход ниже\n\nПредмет: Кронштейн через обмен\nГде взять: Тот же ребёнок\nПолучение / бросок: 2 конфеты — без броска; без конфет 1d20 + Красноречие ≥ 12\nЕсли не получилось: Не отдаёт; можно изготовить замену у Кэрол за 45 минут\n\nПредмет: Кронштейн через угрозу\nГде взять: Тот же ребёнок\nПолучение / бросок: 1d20 + (S − 5) ≥ 12\nЕсли не получилось: Успех — отдаёт; провал — зовёт взрослого. Дальше обмен либо замена у Кэрол\n\nПредмет: Впускной клапан, 1\nГде взять: Машина в юго-восточной части парковки\nПолучение / бросок: 1d20 + (P − 5) ≥ 12; по точной наводке Смитти — без броска\nЕсли не получилось: Вернуться к Смитти за точным местом\n\nПравильный ответ игрока на загадку засчитывается без броска. Клапан снимается подходящим ключом без броска. Без ключа: 1d20 + Ремонт ≥ 12 — снят; провал — нужен ключ или помощь Смитти.\n\nСборка / сдача: Собрать и поставить блок\nБросок и порог: 1d20 + Ремонт ≥ 14; с помощью Кэрол ≥ 11\nУспех: Все три детали установлены, вода очищается\nПровал: Блок течёт; детали сохраняются. Смитти исправит за час совместной работы без нового броска\n\nСборка / сдача: Проверить работающий узел\nБросок и порог: Без броска после ремонта\nУспех: Получить чистую пробу и сдать работу\nПровал: —\n\nВетка Брука: сообщить только о поломке — без броска, Брука не выдают. Назвать Грегориусу виновного — без броска, Брука наказывают, Кэтти прекращает помогать. Эти варианты не заменяют ремонт и не дают вторую награду.\n\nЗавершение / опыт: очиститель работает, доклад сдан — 70 XP за любой способ ремонта. Детали остаются в узле.\n\n8 Доставить двенадцать канистр воды\n\nКто / где: Грегориус; принимают смотрители лавашей. Запуск: «Принеси на фермы двенадцать канистр чистой воды».\n\nПредметы: 12 канистр на складе техуровня. Наполнить у исправного очистителя; до ремонта можно использовать проверенный резерв. Передать смотрителям под отметку, не просто поставить на землю.\n\nВариант: Перенести быстро самому\nБросок и порог: 1d20 + (E − 5) ≥ 11\nУспех: Все 12 сданы за 30 минут\nПровал: Устаёт; доставка занимает 60 минут, но без потери воды и без нового броска\n\nВариант: Взять складскую тележку\nБросок и порог: Без броска после разрешения кладовщика\nУспех: Все 12 сданы за 20 минут\nПровал: —\n\nВариант: Убедить смотрителей выполнить их работу\nБросок и порог: 1d20 + Красноречие ≥ 12\nУспех: Они доставляют воду сами; герой проверяет сдачу\nПровал: Требуют, чтобы герой помог: он несёт первые 6, остальные — смотрители\n\nВариант: Показать ведомость обязанностей\nБросок и порог: Без броска; ведомость на доске ферм\nУспех: Смотрители выполняют доставку\nПровал: —\n\nЗавершение / опыт: приняты 12 канистр чистой воды — 35 XP. Грязная вода и неполная партия задание не закрывают. Помогавшие без угроз работники позднее дают укрытие при побеге.\n\n9 Собрать двадцать четыре початка\n\nКто / где: Кэтти на фермах. Запуск: «Помоги сдать норму. Мне нужны двадцать четыре спелых початка».\n\nПредмет: 24 зрелых початка с грядок ферм → Кэтти. Дорожная еда в награду — отдельный предмет, початки остаются хозяйству.\n\nВариант: Собрать быстро\nБросок и порог: 1d20 + (A − 5) ≥ 10\nУспех: Все 24 собраны за 30 минут\nПровал: За это время собраны 18. Ещё 15 минут работы без броска — оставшиеся 6\n\nВариант: Собрать без спешки\nБросок и порог: Без броска, 1 час\nУспех: Все 24 собраны\nПровал: —\n\nВариант: Получить помощь другого работника\nБросок и порог: 1d20 + Красноречие ≥ 12\nУспех: Дополнительные руки; вся норма за 30 минут\nПровал: Не помогают; доступны два способа выше\n\nЗавершение / опыт: Кэтти получила 24 початка — 25 XP, плюс одна лепёшка. Если герои добились наказания Брука, Кэтти дружескую просьбу не даёт; доп. вариант — сдать ту же норму через смотрителя в помощь Стелле, без восстановления доверия Кэтти.\n\n10 Бардок и тело за кладкой\n\nКто / где: Бардок у западной стены старой парковки. Запуск: «Отойди от стены. Тебе не нужно знать, что там».\n\nЦель: установить, что произошло с охранником, и решить, выдавать ли Бардока. За свежей кладкой находится тело. Кувалда — ящик возле канистр на техуровне, выдаёт кладовщик.\n\nВариант / этап: Добиться доверия\nБросок и порог: 1d20 + (C − 5) ≥ 13; если ранее защищали рабочих — ≥ 10\nУспех: Рассказывает об убийстве и теле\nПровал: Замыкается. Можно предложить напиток или исследовать кладку\n\nВариант / этап: Разговорить за напитком\nБросок и порог: 1 бутылка; 1d20 + Красноречие ≥ 12\nУспех: Признаётся; напиток расходуется\nПровал: Выпил, но не признался. Остаётся поиск тела\n\nВариант / этап: Осмотреть свежую кладку\nБросок и порог: 1d20 + (P − 5) ≥ 12\nУспех: Понимает, где разбирать стену\nПровал: Не понимает; точное признание Бардока или помощь Смитти заменяют поиск\n\nВариант / этап: Разобрать кувалдой\nБросок и порог: 1d20 + (S − 5) ≥ 14\nУспех: Тело обнаружено\nПровал: Шум привлекает работника; дальше объясниться и разбирать вместе без броска\n\nВариант / этап: Разобрать молотком / газовым ключом\nБросок и порог: 1d20 + (S − 5) ≥ 17\nУспех: Тело обнаружено\nПровал: Нужна кувалда или Смитти; инструмент не уничтожается\n\nВариант / этап: Заставить отойти дракой\nБросок и порог: Без проверки на начало\nУспех: При Бардоке ≤ 10 ОЖ он убегает, кладка доступна\nПровал: Можно отступить и искать другой способ\n\nВариант / этап: Доп. Сохранность добычи\nБросок и порог: 1d20 + (L − 5) ≥ 15 при обыске тела, один раз\nУспех: У охранника сохранились 3 пригодных патрона к его карабину\nПровал: Патроны негодны. Само тело и служебный знак доступны независимо от Удачи\n\nРазвязки без дополнительных бросков: выдать Бардока Грегориусу — арест и благодарность власти; скрыть находку — Бардок остаётся и позднее показывает обход поста; убить Бардока — он недоступен как помощник. Если ничего не выяснили и ушли, цель не выполнена.\n\nЗавершение / опыт: факт установлен и выбран исход — 50 XP. За донос после уже засчитанного расследования повторного опыта нет.\n\nПОДСТАВА И ПОБЕГ\n\n11 Принести Хилл Ап раненому охраннику\n\nКто / где: раненый Сын Богов у западного поста, на пути к Пату. Запуск: «Твари меня достали. Принеси у Пата “Хилл-Ап”, быстро».\n\nПредмет: одна доза у Пата → раненому. «Хилл-Ап» = обычный стимулятор твоей системы, +25 ОЖ.\n\nВариант: Получить лекарство по просьбе охранника\nБросок и порог: Без броска\nУспех: Пат выдаёт одну дозу для раненого\nПровал: —\n\nВариант: Дать свой стимулятор\nБросок и порог: Без броска, расход 1 дозы\nУспех: Раненый стабилизирован\nПровал: Без препарата выбрать другой способ\n\nВариант: Доп. Стабилизировать перевязкой\nБросок и порог: 1d20 + Первая помощь ≥ 13\nУспех: Стабилизирован; затем восстановление ОЖ обычной Первой помощью\nПровал: Не стабилизирован; можно принести лекарство или врача\n\nВариант: Доп. Привести Пата\nБросок и порог: Без броска после сообщения\nУспех: Пат лечит лично и становится свидетелем состояния охранника\nПровал: —\n\nВариант: Осмотреть раны ради свидетельства\nБросок и порог: 1d20 + (P − 5) ≥ 12\nУспех: Запомнил укусы существ; к следующему убеждению охраны +2\nПровал: Дополнительного бонуса нет; помощь раненому всё ещё возможна\n\nТаймер сцены: 2 из 39 ОЖ; без помощи через 20 минут теряет сознание, ещё через 10 умирает. Успешная стабилизация или применённый стимулятор останавливают ухудшение.\n\nЗавершение / опыт: препарат передан и применён либо оказана равноценная помощь — 20 XP. Настольная ветка: если раненый выжил, при подставе обвиняют в открытии прохода; его показания снижают порог переговоров задания 12 с 17 до 13. Вызов Пата также запускает разговор о болезни отца; его лечение после возвращения — за рамками этой части.\n\n12 Пережить обвинение\n\nКто / где: обвиняющий охранник у западного поста. Запуск: «Это он! Слуга убил Сына Богов. Бросай всё и стой на месте».\n\nВариант: Заставить выслушать объяснение\nБросок и порог: 1d20 + Красноречие ≥ 17; со спасённым свидетелем ≥ 13\nУспех: Охранник медлит 1 раунд. Можно переместиться на свои ОД к повороту или обратиться к свидетелю\nПровал: Требует сдаться; при попытке уйти начинается бой\n\nВариант: Замечать укрытие и рычаг\nБросок и порог: 1d20 + (P − 5) ≥ 12\nУспех: Порог первого рывка в задании 13 снижается с 14 до 11\nПровал: Рывок остаётся сложностью 14\n\nВариант: Сразу бежать\nБросок и порог: Без проверки на решение\nУспех: Перейти к заданию 13; успешный рывок определяет, успели ли уйти из видимости\nПровал: Если рывок провален — обычный бой\n\nВариант: Остановить преследователя силой\nБросок и порог: Без проверки на начало боя\nУспех: Охранник ≤ 10 ОЖ отступает к посту; можно бежать\nПровал: При задержке приходит второй охранник через 2 раунда\n\nВариант: Доп. Сдаться / оказаться пойманным\nБросок и порог: Без броска\nУспех: Задержание; открываются способы выйти ниже\nПровал: Это не свободный проход наружу\n\nЗадержание: вещи в ящике у решётки. 1d20 + Взлом ≥ 14 с крючком или 1d20 + (S − 5) ≥ 16 для щеколды — дверь открыта. Провал — приходит один охранник и открывает для досмотра: 1d20 + (A − 5) ≥ 14 — проскочить; провал — бой у открытой двери. Переговоры о вызове Пата: 1d20 + Красноречие ≥ 14 — приходит свидетель и задержание приостанавливается; провал — остаются выход через дверь или помощь знакомых.\n\nОпыт: обвинение пройдено, герои получили возможность продолжить выход — 30 XP. Само выслушивание обвинения опыта не даёт.\n\n13 Уйти через Чистилище\n\nСтарт: от западного поста к заслонке, затем пещеры, проход с мертвяками, лестница наружу. Один преследователь; для 3–5 героев на втором раунде подключается второй. Помощь работников, Кэрол или Бардока используется только если отношения сохранены.\n\nЭтап / вариант: Первый рывок за поворот\nБросок и порог: 1d20 + (A − 5) ≥ 14; с наводкой из задания 12 ≥ 11\nУспех: Скрылись из прямой видимости\nПровал: Охранник сохраняет видимость: бой по обычным правилам, дистанция 8 гексов\n\nЭтап / вариант: Закрыть заслонку с исправным трансформатором\nБросок и порог: Без броска, использование 2 ОД\nУспех: Преследование задержано\nПровал: —\n\nЭтап / вариант: Закрыть заслонку без питания\nБросок и порог: 1d20 + (S − 5) ≥ 14\nУспех: Преследование задержано\nПровал: Нужна помощь второго персонажа или упор кувалдой; ещё 1 раунд\n\nЭтап / вариант: Доп. Использовать помощь знакомых\nБросок и порог: Без броска при сохранённой помощи\nУспех: Бардок обходит первый участок; работники укрывают за тележкой; Кэрол гасит свет на одном участке\nПровал: Если помощи нет — обычные проверки, а не автоматический провал\n\nЭтап / вариант: Пройти мимо мертвяков\nБросок и порог: 1d20 + Скрытность ≥ 13\nУспех: Группа прошла к лестнице\nПровал: Начинается бой; путь отступления открыт\n\nЭтап / вариант: Доп. Отвлечь пищей\nБросок и порог: Без броска, один паёк в стороне от пути\nУспех: Существа уходят к приманке; группа проходит\nПровал: Без еды недоступно\n\nЭтап / вариант: Пробиться боем\nБросок и порог: Без проверки на начало\nУспех: Убить, запереть или оставить позади существ\nПровал: Можно отступить и использовать другую ветку\n\nЭтап / вариант: Найти скрытую дверь наружу\nБросок и порог: 1d20 + (P − 5) ≥ 11\nУспех: Дверь найдена сразу, открывается рычагом без ключа\nПровал: Через 2 минуты поиска по сквозняку дверь находится без нового броска; преследование за это время продолжается\n\nБой: 1 мертвяк для одного героя, 2 для двух, 3 для группы 3–5. У каждого 6 ОД: за раунд проходит максимум 6 гексов. Не наносить автоматический урон за провал скрытности — сначала инициатива и обычные атаки.\n\nЗавершение / опыт: все уходящие персонажи выбрались и оторвались от преследования — 80 XP. Мирный обход и бой равноценны по опыту. При незавершённом побеге награда ещё не выдана.\n\n14 Забрать дневник новобранца\n\nГде: северная сервисная комната Чистилища, отдельная ветка до лестницы. Необязательно для выхода.\n\nЭтап: Заметить комнату при спешке\nБросок и порог: 1d20 + (P − 5) ≥ 12\nУспех: Найдена дверь комнаты\nПровал: Прошли мимо; можно вернуться до выхода\n\nЭтап: Вскрыть дверь\nБросок и порог: 1d20 + Взлом ≥ 12\nУспех: Тихий вход\nПровал: Не открыта. Можно выбить или пропустить комнату\n\nЭтап: Выбить дверь\nБросок и порог: 1d20 + (S − 5) ≥ 15\nУспех: Вход открыт; через 3 раунда приходит один из уже имеющихся мертвяков\nПровал: Дверь держится; доступны взлом с новым инструментом или обход\n\nЭтап: Забрать диск\nБросок и порог: Без броска после входа\nУспех: Диск лежит открыто у останков\nПровал: —\n\nЭтап: Прочитать на организаторе\nБросок и порог: Без броска при наличии устройства и грамотности\nУспех: Получена информация о новобранце, Джоке и Келли\nПровал: Без устройства сохранить диск; прочитать позже\n\nЛут комнаты: ящик 1 без замка — 2 бинта и 1 паёк; ящик 2, 1d20 + Взлом ≥ 12 — 1 целебный порошок и проволока; ящик 3, 1d20 + Взлом ≥ 14 — 4 детали оружия и пустой магазин. Провал замка — ящик закрыт; можно пропустить либо вскрыть: 1d20 + (S − 5) ≥ 15, с тем же шумовым последствием. Лут выдаётся один раз на группу.\n\nЗавершение / опыт: диск сохранён и прочитан — 20 XP. Если прочитают позже, начислить тогда. За каждый ящик отдельно опыта нет.\n\nБОЕВЫЕ ПРОФИЛИ\n\nИнициатива: 1d20 + P. Указанный бонус атаки прибавляется к 1d20 против КБ цели. Крит и особенности — по твоим правилам. Удары кулаками по Булли несмертельные, если игрок заранее не заявил обратное.\n\nПротивник: Булли\nОЖ / КБ / ОД / P: 24 / 6 / 8 / 4\nАтака: Кулак +1, урон 1d3, 2 ОД\nКогда прекращает бой: Сдаётся при 6 ОЖ или ниже\n\nПротивник: Крыса\nОЖ / КБ / ОД / P: 10 / 8 / 6 / 5\nАтака: Укус +1, урон 1d4, 3 ОД\nКогда прекращает бой: Убегает при 3 ОЖ или ниже\n\nПротивник: Бардок\nОЖ / КБ / ОД / P: 33 / 5 / 7 / 5\nАтака: Кулак +1, урон 1d4, 3 ОД\nКогда прекращает бой: Убегает при 10 ОЖ или ниже\n\nПротивник: Охранник\nОЖ / КБ / ОД / P: 39 / 11 / 8 / 6\nАтака: Карабин +3, 2d6, 4 ОД; S4, дальность P+2\nКогда прекращает бой: При 10 ОЖ или ниже уходит за помощью\n\nПротивник: Мертвяк\nОЖ / КБ / ОД / P: 22 / 7 / 6 / 4\nАтака: Когти +1, 1d6, 3 ОД\nКогда прекращает бой: Убит при 0 ОЖ; отвлекается на приманку\n\nДоступное оружие этой версии: кастет — 1d4+1, 3 ОД, S3; газовый ключ — 1d6, 3 ОД, S4; кувалда — 1d8, 4 ОД, S6. Перемещение: 1 гекс = 1 ОД. Нехватка S оружия: −3 к атаке за единицу. Если используется одноимённая карточка из твоего каталога оружия, бери её параметры целиком.\n\nОПЫТ ПО ЗАДАНИЯМ\n\n№: 1\nЗадание: Ключ отца\nXP каждому: 50\n\n№: 2\nЗадание: Кирк и Булли\nXP каждому: 40\n\n№: 3\nЗадание: Рад-Аут Стелле\nXP каждому: 50\n\n№: 4\nЗадание: Напиток охраннику\nXP каждому: 30\n\n№: 5\nЗадание: Трансформатор\nXP каждому: 60\n\n№: 6\nЗадание: Причина болезни лавашей\nXP каждому: 40\n\n№: 7\nЗадание: Водоочиститель\nXP каждому: 70\n\n№: 8\nЗадание: 12 канистр\nXP каждому: 35\n\n№: 9\nЗадание: 24 початка\nXP каждому: 25\n\n№: 10\nЗадание: Бардок\nXP каждому: 50\n\n№: 11\nЗадание: Раненый охранник\nXP каждому: 20\n\n№: 12\nЗадание: Обвинение\nXP каждому: 30\n\n№: 13\nЗадание: Побег\nXP каждому: 80\n\n№: 14\nЗадание: Дневник\nXP каждому: 20\n\nВсего при выполнении всех целей: 600 XP каждому. Не складывать награды разных способов одного задания. Помощь раненому даёт 20, а не повторный опыт за лечение и за доставку ампулы.\n",
  "nextStart": ""
};
</script><script>'use strict';
function isTartarModule(){return state.moduleId==='olympus2207-tartar';}
function moduleText(value){return typeof value==='string'?value:Array.isArray(value)?value.map(moduleText).join('\n'):value&&typeof value==='object'?Object.entries(value).map(([key,text])=>`${key}: ${moduleText(text)}`).join('\n'):String(value??'');}
function moduleSource(source){const text=moduleText(source);return text?`<div class="module-source">Источник: ${esc(text)}</div>`:'';}
function moduleSceneName(id){return state.scenes.find(s=>s.id===id)?.title||id;}
function moduleOverview(){if(!isTartarModule())return '';const issued=state.scenes.reduce((sum,s)=>sum+(Number(s.issuedXP)||0),0),total=state.scenes.reduce((sum,s)=>sum+(Number(s.xp)||0),0);return `<section class="panel module-overview"><div><div class="eyebrow">ОЛИМПУС 2207 · ТАРТАР</div><h2>От детства до Чистилища.</h2><p>Проверки, развилки и последствия взяты из твоего модуля. Отмечай исходы по ходу игры.</p></div><div class="module-xp"><strong>${issued}<small> / ${total} XP</small></strong><span>каждому участнику</span><a href="#reference" class="text-button">Правила и награды ↗</a></div><div class="module-overview-actions"><a href="#consequences" class="button ghost small">Факты и последствия ↗</a><a href="#scenes" class="button primary small">Открыть задания ↗</a></div></section>`;}
function moduleSceneDetails(s){if(!isTartarModule()||!s)return '';const dependencies=(state.dependencies||[]).filter(d=>d.from===s.id||d.to===s.id);return `<div class="module-scene"><div class="module-quest-meta"><span class="tag">${esc(s.act||'Задание модуля')}</span>${Number.isFinite(s.xp)?`<span class="module-reward">${s.xp} XP каждому</span>`:''}</div>${s.completion?`<div class="module-completion"><div class="field-label">КОГДА ЦЕЛЬ ВЫПОЛНЕНА</div><p>${esc(s.completion)}</p></div>`:''}${s.xp?`<div class="module-award">${btn(s.issuedXP?'Награда уже выдана ✓':`Выдать ${s.xp} XP каждому`,'award-xp',s.issuedXP?'ghost small':'primary small',`data-id="${esc(s.id)}" ${s.issuedXP?'disabled':''}`)}<span>Один раз за задание. Бой входит в награду.</span></div>`:''}${Array.isArray(s.checks)&&s.checks.length?`<div class="module-checks"><h3>Проверки и развилки <span class="badge">${s.checks.length}</span></h3>${s.checks.map((c,i)=>`<details class="module-check" ${i===0?'open':''}><summary><span class="module-check-number">${String(i+1).padStart(2,'0')}</span>${esc(c.title||'Вариант решения')}</summary><div class="module-check-body"><div class="module-roll">${esc(c.check||'Смотри условия в исходном тексте задания.')}</div>${c.success?`<div class="module-result"><span>УСПЕХ</span><p>${esc(c.success)}</p></div>`:''}${c.failure?`<div class="module-result failure"><span>ПРОВАЛ / ДРУГОЙ ПУТЬ</span><p>${esc(c.failure)}</p></div>`:''}${c.detail?`<p class="module-source">Где взять: ${esc(c.detail)}</p>`:''}${c.notes?`<p class="muted prewrap">${esc(moduleText(c.notes))}</p>`:''}</div></details>`).join('')}</div>`:''}${Array.isArray(s.extras)&&s.extras.length?`<details class="module-extras"><summary>Условия, предметы и развязки</summary>${s.extras.map(text=>`<p class="prewrap">${esc(moduleText(text))}</p>`).join('')}</details>`:''}${dependencies.length?`<div class="module-dependencies"><h3>Связи с другими заданиями</h3>${dependencies.map(d=>{const other=d.from===s.id?d.to:d.from;return `<div class="module-dependency"><button class="text-button" data-action="open-scene" data-id="${esc(other)}">${d.from===s.id?'Далее':'Ранее'}: ${esc(moduleSceneName(other))} ↗</button><strong>${esc(d.label)}</strong><p>${esc(d.detail)}</p></div>`;}).join('')}</div>`:''}</div>`;}
function modulePeopleDirectory(){if(!isTartarModule())return '';return `<section class="panel module-people"><div class="panel-header"><h2 class="panel-title">Персонажи модуля <span class="badge">${state.characters.length}</span></h2></div><div class="module-people-search"><label class="sr-only" for="modulePeopleSearch">Найти персонажа по имени или роли</label><input class="input" type="search" id="modulePeopleSearch" data-module-people-search placeholder="Имя, роль или место в истории…" autocomplete="off"></div><div class="module-people-grid">${state.characters.map(c=>`<button class="module-person-button ${c.id===selectedChar?'selected':''}" data-action="select-char" data-id="${esc(c.id)}" data-search="${esc((c.name+' '+c.role+' '+moduleText(c.source)).toLocaleLowerCase('ru'))}"><span class="module-person-initial">${esc(c.name.slice(0,1))}</span><span><strong>${esc(c.name)}</strong><small>${esc(c.role)}</small></span><span class="module-person-arrow">↗</span></button>`).join('')}</div><p class="module-directory-empty" hidden>Совпадений нет. Попробуй другое имя или роль.</p></section>`;}
function moduleCharacterExtra(c){if(!isTartarModule())return '';return `${c.combat?`<details class="module-combat"><summary>Боевой профиль · справка ведущему</summary><p class="prewrap">${esc(moduleText(c.combat))}</p></details>`:''}${moduleSource(c.source)}`;}
function reference(){const rules=state.rules||[];const quests=state.scenes.filter(s=>Number.isFinite(s.xp));return head('НАСТОЛЬНАЯ НАСТРОЙКА','Справочник ведущего.','Формулы, пороги, боевые профили и опыт из прикреплённого модуля.')+`<div class="module-reference-grid">${rules.map(r=>`<article class="panel module-rule"><h2>${esc(r.title)}</h2><p class="prewrap">${esc(r.text)}</p></article>`).join('')}</div>${quests.length?`<section class="panel module-ledger"><div class="panel-header"><h2 class="panel-title">Опыт по заданиям</h2><span class="tag">КАЖДОМУ УЧАСТНИКУ</span></div><div class="module-ledger-list">${quests.map(s=>`<div class="module-ledger-row"><button class="text-button" data-action="open-scene" data-id="${esc(s.id)}">${esc(s.title)} ↗</button><strong>${s.xp} XP</strong><span class="${s.issuedXP?'module-ledger-done':'muted'}">${s.issuedXP?'Выдано':'Не выдано'}</span></div>`).join('')}</div><div class="module-ledger-total"><strong>Всего: ${quests.reduce((sum,s)=>sum+s.xp,0)} XP каждому</strong><span>Награды разных способов одного задания не складываются.</span></div></section>`:''}<section class="panel module-source-panel"><h2>Исходный текст всегда рядом.</h2><p>Все задания, дополнительные условия и формулировки сохранены в «Рукописи». Карточки помогают вести игру, а исходный текст остаётся основой.</p><a class="button ghost" href="#manuscript">Открыть рукопись ↗</a></section>`;}
function consequences(){return head('РЕШЕНИЯ, КОТОРЫЕ ОТЗОВУТСЯ','Факты и последствия.','Отмечай только состоявшиеся события. «Не определено» сохраняет развилки открытыми.')+`<div class="module-flags">${(state.flags||[]).map(f=>`<article class="panel module-flag"><div><h2>${esc(f.title)}</h2><p>${esc(f.detail)}</p>${moduleSource(f.source)}</div><label class="module-flag-control"><span class="field-label">ЧТО ПРОИЗОШЛО</span><select class="input" data-flag-id="${esc(f.id)}" aria-label="${esc(f.title)}">${[['unknown','Не определено'],['yes','Да'],['no','Нет']].map(([v,t])=>`<option value="${v}" ${f.value===v?'selected':''}>${t}</option>`).join('')}</select></label></article>`).join('')}</div><section class="panel module-dependency-panel"><div class="panel-header"><h2 class="panel-title">Как задания влияют друг на друга</h2><span class="badge">${(state.dependencies||[]).length}</span></div><div class="module-dependency-list">${(state.dependencies||[]).map(d=>`<article class="module-dependency"><div class="module-dependency-path"><button class="text-button" data-action="open-scene" data-id="${esc(d.from)}">${esc(moduleSceneName(d.from))}</button><span>→</span><button class="text-button" data-action="open-scene" data-id="${esc(d.to)}">${esc(moduleSceneName(d.to))} ↗</button></div><strong>${esc(d.label)}</strong><p>${esc(d.detail)}</p></article>`).join('')}</div></section>`;}
function moduleClock(c){const active=c.active===true,steps=Array.isArray(c.steps)?c.steps:[];return `<div class="clock-card module-clock ${active?'running':'dormant'}"><button class="clock" style="--progress:${c.value/c.max*360}deg" data-action="clock-plus" data-id="${esc(c.id)}" ${!active||c.value===c.max?'disabled':''} aria-label="Продвинуть таймер ${esc(c.title)}: ${c.value} из ${c.max}"><span class="clock-inner">${c.value}<small>/${c.max}</small></span></button><div class="clock-copy"><div class="clock-title">${esc(c.title)}</div><div class="clock-label">${c.value===c.max?'Порог достигнут':active?'Отсчёт идёт':'Ожидает события'}${c.unit?' · шаг: '+esc(c.unit):''}</div><div class="clock-controls"><button type="button" data-action="clock-minus" data-id="${esc(c.id)}" ${c.value===0?'disabled':''} aria-label="Уменьшить таймер">−</button><button type="button" data-action="clock-plus" data-id="${esc(c.id)}" ${!active||c.value===c.max?'disabled':''} aria-label="Продвинуть таймер">+</button><button type="button" class="module-clock-toggle" data-action="toggle-module-clock" data-id="${esc(c.id)}">${active?'Пауза':'Начать'}</button></div><details class="module-clock-conditions"><summary>Когда запускать и что произойдёт</summary><p>${esc(c.activation||'Запускай только при наступлении описанного в модуле события.')}</p>${steps.length?`<ol>${steps.map((step,i)=>`<li class="${c.value>=(typeof step==='object'?Number(step.value??step.at)||i+1:i+1)?'reached':''}">${esc(typeof step==='object'?step.text||step.label||moduleText(step):step)}</li>`).join('')}</ol>`:''}<p><strong>Порог:</strong> ${esc(c.consequence)}</p>${moduleSource(c.source)}</details></div></div>`;}
function moduleAction(action,id){if(action==='award-xp'){const s=state.scenes.find(s=>s.id===id);if(!s||!s.xp||s.issuedXP)return true;modal('Подтвердить выполнение задания',`<div class="eyebrow">${esc(s.title)}</div><p>${esc(s.completion||'Цель задания выполнена и сдача подтверждена.')}</p><label class="checkbox-label"><input type="checkbox" name="confirmed" required> Цель выполнена; условия сдачи и награды соблюдены.</label><p class="muted">${s.xp} XP каждому участнику. Опыт за бой уже включён; повторной награды за другой способ нет.</p>`,form=>{if(!form.has('confirmed'))return;if(s.issuedXP){closeModal();return;}s.issuedXP=s.xp;record(`Задание «${s.title}»: выдано ${s.xp} XP каждому участнику. Условия завершения подтверждены ведущим.`,'Опыт');save();closeModal();render();toast('Награда записана один раз.');},btn('Отмена','close-modal','ghost')+'<button class="button primary" type="submit">Подтвердить и выдать XP</button>');return true;}
if(action==='toggle-module-clock'){const c=state.clocks.find(c=>c.id===id);if(!c)return true;c.active=!c.active;record((c.active?'Запущен':'Приостановлен')+' таймер: '+c.title+'. '+(c.unit?'Один шаг: '+c.unit+'. ':''),'Таймер');save();render();return true;}

function diceRefresh(){const result=document.getElementById('diceResult'),history=document.getElementById('diceHistory'),live=document.getElementById('diceLive');if(result)result.innerHTML=diceResultHTML();if(history)history.innerHTML=diceHistoryHTML();if(live){live.textContent=diceSession.error||diceSession.message;live.classList.toggle('dice-error',!!diceSession.error);}const counter=document.getElementById('diceHistoryCount');if(counter)counter.textContent=diceSession.history.length;const clear=document.querySelector('[data-dice-action="clear"]');if(clear)clear.disabled=!diceSession.history.length;const note=document.getElementById('diceHistoryNote');if(note)note.textContent=diceSession.storageOK?'Последние 20 результатов сохраняются в этом браузере.':'История доступна до закрытия вкладки: браузер не разрешил сохранение.';document.querySelectorAll('[data-dice-sides]').forEach(b=>{const chosen=Number(b.dataset.diceSides)===diceSession.selected;b.classList.toggle('selected',chosen);b.setAttribute('aria-pressed',String(chosen));});const form=document.getElementById('diceOptionsForm');if(form)form.querySelector('button').textContent='Бросить выбранный d'+diceSession.selected;}
function diceRoll(sides,repeat=false){if(!DICE_SIDES.includes(sides))return;try{let config;if(repeat&&diceSession.last){config={count:diceSession.last.count,modifier:diceSession.last.modifier};}else config=diceReadOptions();const rolls=Array.from({length:config.count},()=>diceRandomFace(sides));const sum=rolls.reduce((a,b)=>a+b,0);const record={id:Date.now().toString(36)+'-'+(++diceSession.serial),date:new Date().toISOString(),sides,count:config.count,modifier:config.modifier,rolls,sum,total:sum+config.modifier};diceSession.selected=sides;diceSession.last=record;diceSession.history.unshift(record);diceSession.history=diceSession.history.slice(0,20);diceSession.error='';diceSession.message='Бросок '+diceSession.serial+'. '+diceFormula(sides,config.count,config.modifier)+': результат '+record.total+'.'+(config.count>1?' Кубики: '+rolls.join(', ')+'.':'');diceSaveHistory();diceRefresh();if(repeat)document.querySelector('.dice-repeat')?.focus();}catch(error){diceSession.error=error instanceof Error?error.message:'Не удалось выполнить бросок. Попробуй ещё раз.';diceRefresh();}}
document.addEventListener('click',event=>{const button=event.target.closest('[data-dice-action]');if(!button)return;const action=button.dataset.diceAction;if(action==='roll')diceRoll(Number(button.dataset.diceSides));else if(action==='repeat'&&diceSession.last)diceRoll(diceSession.last.sides,true);else if(action==='clear'){diceSession.history=[];diceSession.message='История бросков очищена.';diceSession.error='';diceSaveHistory();diceRefresh();}});

function symbols(root=document.body){const shapes={'↗':'M4 20 20 4M5 4h15v15','↥':'M12 20V4m-7 7 7-7 7 7M4 21h16','↙':'M20 4 4 20m0-15v15h15','↓':'M12 3v18m-7-7 7 7 7-7','⛶':'M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6','⌖':'M12 2v4m0 12v4M2 12h4m12 0h4M12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12'};const pattern=/[↗↥↙↓⛶⌖]/;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];let node;while(node=walker.nextNode())if(pattern.test(node.textContent)&&!node.parentElement.closest('script,style,textarea,svg'))nodes.push(node);for(const n of nodes){const f=document.createDocumentFragment();for(const part of n.textContent.split(/([↗↥↙↓⛶⌖])/)){if(shapes[part]){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','symbol');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.5');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',shapes[part]);svg.append(p);f.append(svg);}else f.append(document.createTextNode(part));}n.replaceWith(f);}}

function clock(c){if(c.activation)return moduleClock(c);return `<div class="clock-card"><button class="clock" style="--progress:${c.value/c.max*360}deg" data-action="clock-plus" data-id="${esc(c.id)}" aria-label="Продвинуть угрозу ${esc(c.title)}: ${c.value} из ${c.max}"><span class="clock-inner">${c.value}<small>/${c.max}</small></span></button><div class="clock-copy"><div class="clock-title">${esc(c.title)}</div><div class="clock-label">${c.value===c.max?'Порог достигнут':c.value===0?'Пока тихо':c.max-c.value+' до последствия'}</div><div class="clock-controls"><button data-action="clock-minus" data-id="${esc(c.id)}" aria-label="Уменьшить угрозу">−</button><button data-action="clock-plus" data-id="${esc(c.id)}" aria-label="Продвинуть угрозу">+</button>${editBtn('clocks',c.id)}</div></div></div>`;}
function overview(){const s=state.scenes.find(s=>s.id===state.current)||state.scenes.find(s=>s.status!=='done');return head('ТВОЯ ИСТОРИЯ ПРОДОЛЖАЕТСЯ','Тартар. Все нити на виду.','От детства до выхода из Чистилища · Olympus 2207',`<span class="session-pill"><span class="live-dot"></span> Сессия ${state.session.toString().padStart(2,'0')}</span>${btn('Завершить сессию ↗','end-session','ghost')}`)+`<div class="campaign-bar"><span>${state.demo?'<span class="demo-tag">ПРИМЕР</span>':'<span class="demo-tag">ТВОЙ СЮЖЕТ</span>'} ${esc(state.title)}</span><button class="text-button" data-action="campaign">Настроить историю ↗</button></div>${state.nextStart?`<div class="banner"><strong>Начать следующую сессию:</strong> ${esc(state.nextStart)}</div>`:''}<div class="stats-strip">${[[state.scenes.filter(s=>s.status!=='done').length,'сцен впереди','scenes'],[state.characters.length,'персонажей в истории','characters'],[state.threads.filter(t=>t.status!=='closed').length,'нитей на доске','threads'],[state.secrets.filter(s=>!s.revealed).length,'нераскрытых тайн','secrets']].map(([n,t,v])=>`<a href="#${v}" class="stat"><span class="stat-number">${String(n).padStart(2,'0')}</span><span class="stat-label">${t}</span><span class="stat-arrow">↗</span></a>`).join('')}</div>${moduleOverview()}<div class="dashboard-grid"><section class="panel scene-panel"><div class="panel-header"><h2 class="panel-title"><span class="tiny-icon">◈</span> Текущая сцена</h2><a class="text-button" href="#scenes">Все сцены ↗</a></div>${s?`${sceneArt()}<div class="scene-feature"><div class="scene-meta"><span class="eyebrow">СЦЕНА ${String(state.scenes.indexOf(s)+1).padStart(2,'0')}</span><span>⌖ ${esc(s.place)}</span></div><h3 class="scene-name">${esc(s.title)}</h3><p class="scene-hook">${esc(modulePublicHook(s))}</p><div class="scene-actions">${btn('Открыть сцену ↗','open-scene','primary',`data-id="${esc(s.id)}"`)}${btn('Режим сцены ⛶','focus','ghost',`data-id="${esc(s.id)}"`)}</div><div class="scene-progress">${state.scenes.map((x,i)=>`<button class="progress-dot ${x.status==='done'?'done':x.id===s.id?'current':''}" data-action="open-scene" data-id="${esc(x.id)}" aria-label="Сцена ${i+1}: ${esc(x.title)}"></button>`).join('')}<span>${state.scenes.filter(x=>x.status==='done').length} из ${state.scenes.length} завершено</span></div></div>`:`<div class="empty-state">${icon('scenes')}<h3>Следующая сцена — твоя.</h3><p>Подготовь место, цель и первую фразу.</p>${btn('＋ Добавить сцену','add','primary','data-kind="scenes"')}</div>`}</section><section class="panel threats-panel"><div class="panel-header"><h2 class="panel-title"><span class="tiny-icon">◷</span> Сценические таймеры</h2><button class="text-button" data-action="add" data-kind="clocks" aria-label="Добавить угрозу">＋</button></div><p class="panel-intro">Точные сроки из модуля. Запускай только при указанном условии; время игры отмечается вручную.</p><div class="clocks-grid">${state.clocks.length?state.clocks.map(clock).join(''):'<div class="empty-state">Добавь угрозу и её последствие.</div>'}</div><div class="threat-foot">Стабилизация раненого останавливает его таймер. Минуты и раунды не смешиваются.</div></section><section class="panel"><div class="panel-header"><h2 class="panel-title">Сюжетные нити <span class="badge">${state.threads.filter(t=>t.status!=='closed').length}</span></h2><a class="text-button" href="#threads">Все нити ↗</a></div><div class="thread-list">${state.threads.filter(t=>t.status!=='closed').slice(0,3).map(t=>`<a href="#threads" class="thread-row"><span class="thread-dot"></span><div class="thread-copy"><div class="thread-title">${esc(t.title)}</div><div class="thread-sub">${esc(t.detail)}</div></div><span>↗</span></a>`).join('')||'<div class="empty-state">У каждой истории есть незакрытый вопрос.</div>'}</div></section><section class="panel oracle-panel"><div class="panel-header"><h2 class="panel-title"><span class="tiny-icon">✧</span> Если всё пошло не по плану</h2><span class="tag">ИДЕИ ВНЕ МОДУЛЯ</span></div><div id="oracleBody">${oracleHTML()}</div></section><section class="panel quick-note-panel"><div class="panel-header"><h2 class="panel-title">На полях</h2><a class="text-button" href="#journal">Журнал ↗</a></div><form id="quickNote" class="note-form"><label class="sr-only" for="quickNoteText">Решение или заметка</label><textarea id="quickNoteText" class="textarea" name="text" rows="2" required maxlength="10000" placeholder="Герои решили… Мир ответит на это…"></textarea>${btn('Запомнить ↗','submit-note','primary small','type="submit"')}</form></section></div>`;}
function oracleHTML(){return oracle?`<div class="oracle-title">${esc(oracle.title)}</div><p class="oracle-copy">${esc(oracle.body)}</p><p class="oracle-question">${esc(oracle.question)}</p><div class="oracle-actions">${btn('Ещё вариант','oracle-again','ghost small')}${btn('Взять в заметки ↗','oracle-save','primary small')+btn(oracleKind==='worldMoves'?'Поворот ↗':'Ход мира ↗',oracleKind==='worldMoves'?'oracle':'world','ghost small')}</div>`:`<div class="oracle-title">История умеет удивлять.<br>Даже ведущего.</div><p class="oracle-copy">Вытащи идею для поворота или узнай, что изменилось за кадром.</p><div class="oracle-actions">${btn('✧ Вытянуть поворот','oracle','primary small')}${btn('Ход мира ↗','world','ghost small')}</div>`;}
function scenes(){let s=state.scenes.find(x=>x.id===selectedScene)||state.scenes.find(x=>x.id===state.current)||state.scenes[0];return head('ПУТЬ ИСТОРИИ','Сцены','Подготовь ситуацию. Оставь героям право изменить исход.',btn('＋ Новая сцена','add','primary','data-kind="scenes"'))+`<div class="split-layout"><div class="list-stack">${state.scenes.map((x,i)=>`<button class="scene-list-card ${s?.id===x.id?'active':''}" data-action="select-scene" data-id="${esc(x.id)}"><span class="scene-number">${String(i+1).padStart(2,'0')}</span><div><strong>${esc(x.title)}</strong><small>${x.act?esc(x.act)+' · ':''}${esc(x.place)} · ${statusLabel(x.status)}</small></div><span>↗</span></button>`).join('')||empty('Пока чистая страница. Добавь первую сцену.','scenes')}</div>${s?`<section class="panel scene-detail"><div class="panel-header"><span class="tag">${statusLabel(s.status)}</span>${editBtn('scenes',s.id)}</div><h2 class="scene-name">${esc(s.title)}</h2><div class="muted">⌖ ${esc(s.place)}</div><div class="field"><div class="field-label">ПЕРВАЯ ФРАЗА</div><p class="scene-hook">${esc(modulePublicHook(s))}</p></div><div class="field"><div class="field-label">ЧТО ЗДЕСЬ НА КОНУ</div><p>${esc(s.goal)}</p></div>${moduleSceneDetails(s)}<details class="source-notes"><summary>Полный текст задания · заметки ведущего</summary><p class="prewrap">${esc(s.notes)}</p></details><div class="scene-actions">${btn('⛶ Показать сцену','focus','ghost',`data-id="${esc(s.id)}"`)}${s.status==='done'?btn('Вернуть в подготовку','reopen-scene','ghost',`data-id="${esc(s.id)}"`):s.id===state.current?btn('Завершить сцену ✓','complete-scene','primary',`data-id="${esc(s.id)}"`):btn('Сделать текущей','activate-scene','primary',`data-id="${esc(s.id)}"`)}</div></section>`:''}</div>`;}
function empty(text,kind){return `<div class="empty-state"><p>${text}</p>${kind?btn('＋ Добавить','add','ghost',`data-kind="${kind}"`):''}</div>`;}
function characters(){const c=state.characters.find(x=>x.id===selectedChar)||state.characters[0];return head('У КАЖДОГО ЕСТЬ МОТИВ','Люди между строк.','Помни, чего они хотят. И о чём предпочитают молчать.',btn('＋ Персонаж','add','primary','data-kind="characters"'))+`${modulePeopleDirectory()}<section class="panel"><div class="panel-header"><h2 class="panel-title">Карта связей выбранного персонажа</h2>${btn('＋ Связь','add-relation','ghost small')}</div><div class="graph-wrap">${graph()}</div><p class="graph-hint">Выбери персонажа в списке или на карте. Здесь показаны его прямые связи; полные условия перечислены ниже.</p></section>${c?`<div class="split-layout character-details"><section class="panel entity-card"><div class="card-top"><span class="avatar">${esc(c.name.slice(0,1))}</span>${editBtn('characters',c.id)}</div><h2 class="card-title">${esc(c.name)}</h2><p class="muted">${esc(c.role)}</p><div class="field"><div class="field-label">ХОЧЕТ</div><p>${esc(c.want)}</p></div><details><summary>Тайна персонажа · только для ведущего</summary><p class="prewrap">${esc(c.secret)}</p></details>${moduleCharacterExtra(c)}</section><section class="panel"><div class="panel-header"><h2 class="panel-title">Его нити</h2></div><div class="relation-list">${state.relations.filter(r=>r.from===c.id||r.to===c.id).map(r=>`<div class="relation-row"><span>${esc(state.characters.find(x=>x.id===r.from)?.name)} <span class="muted">→ ${esc(r.label)} →</span> ${esc(state.characters.find(x=>x.id===r.to)?.name)}${r.source?'<small class="relation-source">'+esc(r.source)+'</small>':''}</span><button class="text-button" data-action="delete-relation" data-id="${esc(r.id)}" aria-label="Удалить связь">×</button></div>`).join('')||empty('Связи ещё не обозначены.')}</div></section></div>`:empty('Первый персонаж ждёт своего имени.','characters')}`;}
function graph(){const selected=state.characters.find(x=>x.id===selectedChar)||state.characters[0];if(!selected)return empty('Добавь персонажей, чтобы увидеть связи.');const rel=state.relations.filter(r=>r.from===selected.id||r.to===selected.id);const ids=new Set([selected.id,...rel.flatMap(r=>[r.from,r.to])]);const chars=state.characters.filter(c=>ids.has(c.id)),n=chars.length,width=900,height=Math.max(320,Math.ceil(n/5)*150);const pts=chars.map((c,i)=>({...c,x:n<=6?450+Math.cos(-Math.PI/2+i/n*Math.PI*2)*Math.min(300,n*75):90+(i%5)*180,y:n<=6?height/2+Math.sin(-Math.PI/2+i/n*Math.PI*2)*100:65+Math.floor(i/5)*150}));return `<svg viewBox="0 0 ${width} ${height}" role="group" aria-label="Прямые связи выбранного персонажа">${rel.map(r=>{const a=pts.find(p=>p.id===r.from),b=pts.find(p=>p.id===r.to);if(!a||!b)return'';return `<g><title>${esc(a.name)} → ${esc(r.label)} → ${esc(b.name)}</title><path d="M${a.x} ${a.y} L${b.x} ${b.y}" fill="none" stroke="#a9ae9d" stroke-width="1.5" stroke-dasharray="4 5"/></g>`;}).join('')}${pts.map(c=>`<g class="graph-node ${c.id===selected.id?'selected':''}" role="button" tabindex="0" data-action="select-char" data-id="${esc(c.id)}" aria-label="Открыть персонажа ${esc(c.name)}"><circle cx="${c.x}" cy="${c.y}" r="25"/><text x="${c.x}" y="${c.y+6}" text-anchor="middle" class="graph-initial">${esc(c.name.slice(0,1))}</text><rect x="${c.x-86}" y="${c.y+31}" width="172" height="40" rx="4" fill="#f4f2e9"/><text x="${c.x}" y="${c.y+49}" text-anchor="middle" class="graph-name">${esc(c.name.slice(0,21))}</text>${c.name.length>21?`<text x="${c.x}" y="${c.y+64}" text-anchor="middle" class="graph-name">${esc(c.name.slice(21,42))}</text>`:''}</g>`).join('')}</svg>`;}

function threads(){return head('НИ ОДИН ВЫБОР НЕ ИСЧЕЗАЕТ','Сюжетные нити','Вопросы, обещания и последствия, которые ещё отзовутся.',btn('＋ Новая нить','add','primary','data-kind="threads"'))+`<div class="kanban">${[['open','В игре'],['later','На потом'],['closed','Закрыто']].map(([status,label])=>`<section class="kanban-column"><div class="kanban-title">${label}<span class="badge">${state.threads.filter(t=>t.status===status).length}</span></div>${state.threads.filter(t=>t.status===status).map(t=>`<article class="thread-card"><div class="card-top"><span class="thread-dot"></span>${editBtn('threads',t.id)}</div><h2 class="card-title">${esc(t.title)}</h2><p class="card-body">${esc(t.detail)}</p><label class="field-label" for="thread-${esc(t.id)}">СТАТУС</label><select class="input" id="thread-${esc(t.id)}" data-thread="${esc(t.id)}">${['open','later','closed'].map(v=>`<option value="${v}" ${v===status?'selected':''}>${statusLabel(v)}</option>`).join('')}</select></article>`).join('')||'<p class="muted kanban-empty">Здесь пока тихо.</p>'}</section>`).join('')}</div>`;}
function secrets(){return head('ПО ЭТУ СТОРОНУ ШИРМЫ','Правда под поверхностью.','Отделяй то, что знаешь ты, от того, что уже узнали герои.',btn('＋ Новая тайна','add','primary','data-kind="secrets"'))+`<div class="card-grid">${state.secrets.map(x=>`<article class="panel secret-card"><div class="card-top"><span class="tag">${x.revealed?'РАСКРЫТО':'ЗА ШИРМОЙ'}</span>${editBtn('secrets',x.id)}</div><h2 class="card-title">${esc(x.title)}</h2><div class="field"><div class="field-label">УЛИКА ДЛЯ ГЕРОЕВ</div><p>${esc(x.clue)}</p></div><details ${x.revealed?'open':''}><summary>${x.revealed?'Истина':'Показать истину ведущему'}</summary><p class="prewrap">${esc(x.truth)}</p></details><div class="card-footer">${btn(x.revealed?'Вернуть за ширму':'Герои узнали правду ✓','toggle-secret',x.revealed?'ghost small':'primary small',`data-id="${esc(x.id)}"`)}</div></article>`).join('')||empty('Что на самом деле происходит в твоей истории?','secrets')}</div>`;}
function journal(){return head('ПАМЯТЬ ИСТОРИИ','То, что уже случилось.','Решения героев и ответы мира. Всё, что стоит унести в следующую сессию.',btn('↓ Скачать журнал','journal-export','ghost'))+`<section class="panel"><div class="panel-header"><h2 class="panel-title">Новая запись</h2><span class="tag">СЕССИЯ ${state.session}</span></div><form class="note-form" id="journalForm"><label class="sr-only" for="journalText">Текст записи</label><textarea class="textarea" id="journalText" name="text" rows="3" required maxlength="20000" placeholder="Какое решение приняли герои? Что изменилось в мире?"></textarea><div class="scene-actions"><label class="sr-only" for="noteKind">Тип записи</label><select id="noteKind" class="input" name="kind"><option>Решение</option><option>Последствие</option><option>Заметка</option></select><button class="button primary" type="submit">Запомнить ↗</button></div></form></section><div class="journal-list">${state.journal.map(j=>`<article class="journal-item"><div class="journal-time">${esc(new Date(j.date).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}<span>Сессия ${j.session||1}</span></div><div class="journal-content"><span class="tag">${esc(j.kind)}</span><p class="prewrap">${esc(j.text)}</p></div><button class="text-button" data-action="delete-journal" data-id="${esc(j.id)}" aria-label="Удалить запись">×</button></article>`).join('')||empty('Пока ничего не записано. У истории хорошая память — если ей немного помочь.')}</div>`;}
function manuscript(){return head('С ЧЕГО ВСЁ НАЧАЛОСЬ','Твоя рукопись.','Держи исходный текст рядом с живой историей.',btn('↥ Открыть .txt / .md','story-file','ghost'))+`${state.demo?'<div class="banner"><strong>Сейчас открыт пример.</strong> Это вымышленная история для знакомства с пультом. Вставь свой сюжет ниже или начни чистую историю.</div>':''}<section class="panel manuscript"><form id="manuscriptForm"><label class="field-label" for="storyTitle">НАЗВАНИЕ ИСТОРИИ</label><input id="storyTitle" name="title" class="input" required maxlength="200" value="${esc(state.title)}"><label class="field-label" for="storyText">ИСХОДНЫЙ ТЕКСТ</label><textarea id="storyText" name="text" class="textarea manuscript-text" rows="18" maxlength="1000000" placeholder="Вставь текст сюжета сюда…">${esc(state.manuscript)}</textarea><label class="checkbox-label"><input type="checkbox" name="fromHeadings"> Добавить сцены из заголовков Markdown (# и ##)</label><p class="muted">Текст сохраняется как есть. Заголовки можно превратить в заготовки сцен, персонажей и тайны ты задаёшь сам.</p><div class="scene-actions"><button class="button primary" type="submit">Сохранить рукопись ↗</button>${btn('Начать чистую историю','new-story','ghost')}</div></form></section>${moduleRestorePanel()}<section class="panel settings-panel"><div class="panel-header"><h2 class="panel-title">Твоя история остаётся у тебя.</h2></div><p>Изменения хранятся в этом браузере. Для переноса на другое устройство скачай резервную копию. Очистка данных браузера удалит локальные записи.</p><div class="scene-actions">${btn('↓ Скачать копию','backup','ghost')}${btn('↥ Восстановить из JSON','restore','ghost')}</div></section>`;}

function modal(title,body,onSubmit,footer='',large=false){lastFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="modal ${large?'large':''}"><div class="modal-header"><h2 id="modalTitle">${title}</h2><button class="close-button" data-action="close-modal" aria-label="Закрыть">×</button></div><form id="dialogForm"><div class="modal-body">${body}</div><div class="modal-footer">${footer||btn('Отмена','close-modal','ghost')+'<button class="button primary" type="submit">Сохранить ↗</button>'}</div></form></section></div>`;document.body.style.overflow='hidden';$('#dialogForm').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.currentTarget));};setTimeout(()=>$('#modalRoot').querySelector('input,textarea,select,button')?.focus(),30);}

function field(key,label,value='',type='input',required=false,options=[]){let control=type==='textarea'?`<textarea class="textarea" id="f-${key}" name="${key}" rows="3" maxlength="20000" ${required?'required':''}>${esc(value)}</textarea>`:type==='select'?`<select class="input" id="f-${key}" name="${key}">${options.map(([k,l])=>`<option value="${esc(k)}" ${k===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select>`:`<input class="input" id="f-${key}" name="${key}" value="${esc(value)}" maxlength="300" ${required?'required':''}>`;return `<div class="field"><label class="field-label" for="f-${key}">${label}</label>${control}</div>`;}
const schemas={scenes:{title:'Сцена',fields:[['title','Название','input',true],['place','Место'],['playerTitle','Заголовок для игроков'],['playerPlace','Место для игроков'],['hook','Первая фраза · можно показать героям','textarea'],['goal','Что на кону','textarea'],['notes','Заметки только для ведущего','textarea']]},characters:{title:'Персонаж',fields:[['name','Имя','input',true],['role','Роль в истории'],['want','Чего хочет','textarea'],['secret','Что скрывает','textarea']]},threads:{title:'Сюжетная нить',fields:[['title','Открытый вопрос','input',true],['detail','Зацепки и возможные последствия','textarea']]},clocks:{title:'Угроза',fields:[['title','Что приближается','input',true],['consequence','Что случится, когда часы заполнятся','textarea',true],['max','Число шагов','select',true]]},secrets:{title:'Тайна',fields:[['title','Название','input',true],['clue','Улика для героев','textarea'],['truth','Скрытая истина','textarea',true]]}};
function editor(kind,id){const schema=schemas[kind];if(!schema)return;const old=state[kind].find(x=>x.id===id);const defaults={scenes:{place:'',goal:'',hook:'',notes:'',status:'ready'},characters:{role:'',want:'',secret:'',color:'moss'},threads:{detail:'',status:'open'},clocks:{max:6,value:0,consequence:''},secrets:{truth:'',clue:'',revealed:false}};const obj=old||{...defaults[kind]};modal(`${old?'Редактировать':'Добавить'} · ${schema.title}`,schema.fields.map(([k,l,t,r])=>field(k,l,obj[k]??'',t||'input',r,k==='max'?[2,3,4,6,8,10,12].map(x=>[String(x),String(x)]):[])).join(''),f=>{const data={...obj,id:old?.id||uid()};for(const[k]of schema.fields)data[k]=k==='max'?Number(f.get(k)):String(f.get(k)||'').trim();if(!data[schema.fields[0][0]]){toast('Название не может быть пустым.');return;}if(kind==='clocks')data.value=Math.min(data.value,data.max);if(old)state[kind]=state[kind].map(x=>x.id===id?data:x);else{state[kind].push(data);if(kind==='scenes'&&!state.current){state.current=data.id;data.status='active';}if(kind==='characters')selectedChar=data.id;}save();closeModal();render();toast('Сохранено.');},(old?btn('Удалить','delete-entity','danger',`data-kind="${kind}" data-id="${esc(id)}"`):'')+btn('Отмена','close-modal','ghost')+'<button class="button primary" type="submit">Сохранить ↗</button>');}

function newStory(title='Новая история',text=''){state={version:1,title:title.trim()||'Новая история',demo:false,session:1,current:null,scenes:[],characters:[],relations:[],threads:[],clocks:[],secrets:[],journal:[],manuscript:text,nextStart:''};selectedScene=null;selectedChar=null;oracle=null;save();}

function sceneAction(id,mode){const s=state.scenes.find(x=>x.id===id);if(!s)return;if(mode==='complete'){s.status='done';record('Завершена сцена: '+s.title,'Сцена');const next=state.scenes.find(x=>x.status!=='done');state.current=next?.id||null;if(next)next.status='active';selectedScene=next?.id||s.id;}else if(mode==='reopen'){s.status='ready';if(!state.current){state.current=s.id;s.status='active';}}else{state.scenes.forEach(x=>{if(x.status==='active')x.status='ready';});s.status='active';state.current=s.id;record('Начата сцена: '+s.title,'Сцена');}save();render();}
function focusScene(id){const s=state.scenes.find(x=>x.id===id);if(!s)return;lastFocus=document.activeElement;$('#focusRoot').innerHTML=`<section class="focus-mode" role="dialog" aria-modal="true" aria-label="Режим сцены"><div class="focus-controls"><span>НИТИ · РЕЖИМ СЦЕНЫ</span><button class="button ghost" data-action="close-focus">Закрыть · Esc</button></div><div class="focus-content"><div class="focus-eyebrow">${esc(s.playerPlace||s.place)}</div><h1 class="focus-title">${esc(s.playerTitle||s.title)}</h1><p class="focus-text">${esc(modulePublicHook(s))}</p><span class="focus-ornament">✧</span></div><div class="focus-foot">В этой сцене всё ещё возможно.</div></section>`;document.body.style.overflow='hidden';$('#focusRoot button').focus();}

function advanceClock(id,delta){const c=state.clocks.find(x=>x.id===id);if(!c)return;if(c.activation&&!c.active&&delta>0){toast('Сначала запусти таймер при указанном условии.');return;}const before=c.value;c.value=Math.max(0,Math.min(c.max,c.value+delta));if(c.value===before)return;const milestone=c.steps?.find(x=>x.at===c.value);if(delta>0&&milestone)record(c.title+': '+milestone.label,'Отметка таймера');if(c.value===c.max){if(c.activation)c.active=false;record('Достигнут срок: '+c.title+'. '+c.consequence,'Таймер');save();render();modal('Достигнута отметка времени.',`<div class="eyebrow">${esc(c.title)}</div><p class="scene-hook">${esc(c.consequence)}</p><p class="muted">Отметка записана в журнал. Примени последствие по условиям модуля.</p>`,()=>closeModal(),'<button class="button primary" type="submit">Вернуться за ширму</button>');}else{save();render();if(delta>0&&milestone)toast(milestone.label);}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,kind=b.dataset.kind;const actions={manuscript:()=>navigate('manuscript'),add:()=>editor(kind),edit:()=>editor(kind,id),'close-modal':closeModal,'close-focus':closeFocus,'open-scene':()=>{selectedScene=id;navigate('scenes');},'select-scene':()=>{selectedScene=id;render();},'select-char':()=>{selectedChar=id;render();},focus:()=>focusScene(id),'activate-scene':()=>sceneAction(id,'active'),'complete-scene':()=>sceneAction(id,'complete'),'reopen-scene':()=>sceneAction(id,'reopen'),'clock-plus':()=>advanceClock(id,1),'clock-minus':()=>advanceClock(id,-1),oracle:()=>{oracleKind='complications';actions['oracle-again']();},'oracle-again':()=>{const list=STORY_PROMPTS[oracleKind];const pool=list.filter(x=>x.id!==oracle?.id);oracle=pool[Math.floor(Math.random()*pool.length)];$('#oracleBody').innerHTML=oracleHTML();},world:()=>{oracleKind='worldMoves';actions['oracle-again']();},'oracle-save':()=>{if(!oracle)return;record(oracle.title+'\n'+oracle.body+'\n'+oracle.question,'Идея, не факт');save();toast('Идея записана в журнал.');},'toggle-secret':()=>{const x=state.secrets.find(x=>x.id===id);x.revealed=!x.revealed;record((x.revealed?'Герои узнали тайну: ':'Тайна возвращена за ширму: ')+x.title,'Тайна');save();render();},backup:()=>{download('niti-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2));toast('Копия скачана. Храни её вместе с рукописью.');},restore:()=>$('#backupFile').click(),'story-file':()=>$('#storyFile').click(),'journal-export':()=>download('niti-session-journal.md',`# ${state.title}\n\n`+state.journal.slice().reverse().map(j=>`## ${j.kind} · сессия ${j.session||1}\n${new Date(j.date).toLocaleString('ru-RU')}\n\n${j.text}\n`).join('\n'),'text/markdown'),'new-story':()=>confirmDialog('Начать новую историю?','Текущая история в этом браузере будет заменена. Сначала скачай резервную копию, если хочешь её сохранить.',()=>{newStory();},'Начать с чистого листа'),'delete-entity':()=>confirmDialog('Удалить запись?','Запись будет удалена. Для персонажа также удалятся его связи.',()=>{state[kind]=state[kind].filter(x=>x.id!==id);if(kind==='characters')state.relations=state.relations.filter(x=>x.from!==id&&x.to!==id);if(kind==='scenes'&&state.dependencies)state.dependencies=state.dependencies.filter(d=>d.from!==id&&d.to!==id);if(kind==='scenes'&&state.current===id){state.current=state.scenes.find(x=>x.status!=='done')?.id||null;if(state.current)state.scenes.find(x=>x.id===state.current).status='active';}save();},'Удалить'),'delete-relation':()=>confirmDialog('Удалить связь?','Персонажи останутся в истории.',()=>{state.relations=state.relations.filter(r=>r.id!==id);save();},'Удалить'),'delete-journal':()=>confirmDialog('Удалить запись из журнала?','Это действие уберёт только выбранную запись.',()=>{state.journal=state.journal.filter(x=>x.id!==id);save();},'Удалить'),'add-relation':()=>{if(state.characters.length<2){toast('Для связи нужны хотя бы два персонажа.');return;}const opts=state.characters.map(c=>[c.id,c.name]);modal('Новая связь',field('from','От кого',opts[0][0],'select',true,opts)+field('to','К кому',opts[1][0],'select',true,opts)+field('label','Что их связывает','','input',true),f=>{if(f.get('from')===f.get('to')){toast('Выбери двух разных персонажей.');return;}const label=String(f.get('label')).trim();if(!label){toast('Опиши связь.');return;}state.relations.push({id:uid(),from:f.get('from'),to:f.get('to'),label});save();closeModal();render();});},campaign:()=>modal('Название истории',field('title','Название',state.title,'input',true),f=>{const title=String(f.get('title')).trim();if(!title){toast('Введи название.');return;}state.title=title;save();closeModal();render();}),'end-session':()=>modal('Оставь след для себя будущего.',field('changed','Что изменилось','', 'textarea',true)+field('open','Что осталось открытым','','textarea')+field('next','С чего начнём в следующий раз',state.nextStart,'textarea',true),f=>{const changed=String(f.get('changed')).trim(),next=String(f.get('next')).trim();if(!changed||!next){toast('Запиши итог и начало следующей сессии.');return;}record('Что изменилось:\n'+changed+'\n\nОсталось открытым:\n'+String(f.get('open')).trim()+'\n\nВ следующий раз:\n'+next,'Итоги сессии');state.nextStart=next;state.session++;save();closeModal();render();toast('Сессия завершена. Продолжение уже ждёт.');}),help:()=>modal('Добро пожаловать за ширму.',`<p><strong>1. Принеси свою историю.</strong> В «Рукописи» вставь текст или открой .txt / .md. Сейчас загружен модуль «Тартар» из твоего файла: 14 заданий с проверками, связями и наградами.</p><p><strong>2. Подготовь опоры.</strong> Добавь сцены, мотивы персонажей, тайны и часы угроз. Всё можно менять.</p><p><strong>3. Веди свободно.</strong> Открывай сцену без секретов, записывай решения и двигай часы, когда это логично для мира.</p><p><strong>4. Сохрани продолжение.</strong> Заверши сессию и скачай резервную копию. Данные хранятся только в этом браузере, без синхронизации между устройствами. Во вкладке «Факты и последствия» вручную отмечай исходы; завершение сцены не выдаёт опыт автоматически.</p><p class="muted">Повороты — отдельная необязательная колода идей. Они не заменяют содержание модуля и попадают в журнал как идеи, не факты.</p>`,()=>closeModal(),'<button class="button primary" type="submit">Я за ширмой ↗</button>')};if(actions[a])actions[a]();else moduleAction(a,id,b);});
document.addEventListener('submit',e=>{if(e.target.id==='quickNote'||e.target.id==='journalForm'){e.preventDefault();const f=new FormData(e.target),text=String(f.get('text')).trim();if(!text){toast('Сначала запиши мысль.');return;}record(text,f.get('kind')||'Заметка');save();e.target.reset();toast('История запомнила.');if(view==='journal')render();}if(e.target.id==='manuscriptForm'){e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')).trim();if(!title){toast('У истории должно быть название.');return;}const text=String(f.get('text')||'');const apply=()=>{state.title=title;state.manuscript=text;state.demo=false;let count=0;if(f.has('fromHeadings')){const parts=text.split(/^(#{1,2})\s+(.+)$/gm);for(let i=1;i<parts.length;i+=3){const title=parts[i+1].trim(),notes=(parts[i+2]||'').trim();state.scenes.push({id:uid(),title,place:'',goal:'',hook:notes.split(/\n\s*\n/)[0]?.slice(0,1500)||'',notes,status:'ready'});count++;}if(!state.current&&state.scenes.length){state.current=state.scenes[0].id;state.scenes[0].status='active';}}save();render();toast('Рукопись сохранена.'+(count?' Добавлено сцен: '+count+'.':''));};if(state.demo){confirmDialog('Заменить пример своим сюжетом?','Демонстрационные сцены, персонажи, тайны и журнал будут очищены. Текст из формы станет рукописью новой истории.',()=>{newStory(title,text);apply();},'Загрузить мою историю');}else apply();}});
document.addEventListener('change',e=>{if(e.target.dataset.thread){const t=state.threads.find(x=>x.id===e.target.dataset.thread);if(!t)return;t.status=e.target.value;record('Нить «'+t.title+'»: '+statusLabel(t.status),'Нить');save();render();}});
$('#storyFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2000000){toast('Файл слишком большой. Выбери текст до 2 МБ.');return;}try{const text=await f.text();navigate('manuscript');setTimeout(()=>{$('#storyText').value=text;$('#storyTitle').value=f.name.replace(/\.(txt|md)$/i,'');toast('Текст открыт. Нажми «Сохранить рукопись».');},30);}catch{toast('Не удалось прочитать файл.');}e.target.value='';});
$('#backupFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(!validState(data))throw Error();confirmDialog('Восстановить историю?',`«${data.title}» заменит текущую историю в этом браузере.`,()=>{state=data;selectedScene=state.current;selectedChar=state.characters[0]?.id;oracle=null;save();toast('История восстановлена.');},'Восстановить');}catch{toast('Не удалось открыть копию. Нужен JSON, скачанный из «Нитей».');}e.target.value='';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#focusRoot').children.length)closeFocus();else if($('#modalRoot').children.length)closeModal();}if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('graph-node')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}const root=$('#focusRoot').children.length?$('#focusRoot'):$('#modalRoot').children.length?$('#modalRoot'):null;if(e.key==='Tab'&&root){const els=[...root.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);if(els.length){const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
render();symbols();if(storageOK)save();
